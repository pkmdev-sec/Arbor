<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Arbor — 3D Tree Logo</title>
  <defs>
    <!-- ═══════════ CONTAINER ═══════════ -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- ═══════════ TRUNK ═══════════ -->
    <linearGradient id="trunk" x1="256" y1="400" x2="256" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D2312"/>
      <stop offset="50%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>

    <!-- ═══════════ BRANCH GRADIENTS (dark at fork → vibrant at tip) ═══════════ -->
    <linearGradient id="b1" x1="256" y1="280" x2="120" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B6508"/><stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="b2" x1="256" y1="280" x2="160" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#065F46"/><stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="b3" x1="256" y1="280" x2="210" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4C1D95"/><stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="b4" x1="256" y1="280" x2="256" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E4D6D"/><stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="b5" x1="256" y1="280" x2="302" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#831843"/><stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="b6" x1="256" y1="280" x2="352" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#134E4A"/><stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="b7" x1="256" y1="280" x2="392" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9A3412"/><stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- ═══════════ NODE GLASS SPHERE GRADIENTS ═══════════ -->
    <radialGradient id="n1" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#FFE082"/><stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <radialGradient id="n2" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#6EE7B7"/><stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="n3" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>
    <radialGradient id="n4" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#67E8F9"/><stop offset="100%" stop-color="#0891B2"/>
    </radialGradient>
    <radialGradient id="n5" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#FBCFE8"/><stop offset="100%" stop-color="#DB2777"/>
    </radialGradient>
    <radialGradient id="n6" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#99F6E4"/><stop offset="100%" stop-color="#0D9488"/>
    </radialGradient>
    <radialGradient id="n7" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="40%" stop-color="#FDBA74"/><stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>

    <!-- ═══════════ FORK JUNCTION ═══════════ -->
    <radialGradient id="fork" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#FFFBEB"/><stop offset="50%" stop-color="#FCD34D"/><stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- ═══════════ FILTERS ═══════════ -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- ═══════════ CLIP PATH FOR BRANCH 3D EFFECTS ═══════════ -->
    <clipPath id="bc">
      <path d="M 253,286 Q 160,235 118,141 L 122,139 Q 170,225 259,274 Z"/>
      <path d="M 251,285 Q 190,215 158,121 L 162,119 Q 200,205 261,275 Z"/>
      <path d="M 249,282 Q 222,203 208,106 L 212,104 Q 228,197 263,278 Z"/>
      <path d="M 249,280 L 253.5,100 L 258.5,100 L 263,280 Z"/>
      <path d="M 263,282 Q 290,203 304,106 L 300,104 Q 284,197 249,278 Z"/>
      <path d="M 261,285 Q 322,215 354,121 L 350,119 Q 312,205 251,275 Z"/>
      <path d="M 259,286 Q 352,235 394,141 L 390,139 Q 342,225 253,274 Z"/>
    </clipPath>
  </defs>

  <!-- ═══════════ CONTAINER ═══════════ -->
  <rect x="44" y="44" width="424" height="424" rx="90" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="44" y="44" width="424" height="424" rx="90" fill="url(#vig)"/>
  <rect x="44" y="44" width="424" height="212" rx="90" fill="url(#shine)"/>
  <rect x="44.5" y="44.5" width="423" height="423" rx="89.5" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- ═══════════ TRUNK (3D cylinder: body + highlight + shadow) ═══════════ -->
  <path d="M 242,400 C 243,370 247,320 249,280 L 263,280 C 265,320 269,370 270,400 Z" fill="url(#trunk)"/>
  <path d="M 242,400 C 243,370 247,320 249,280 L 253,280 C 251,320 248,370 247,400 Z" fill="#fff" opacity="0.12"/>
  <path d="M 260,280 L 263,280 C 265,320 269,370 270,400 L 265,400 C 265,370 263,320 260,280 Z" fill="#000" opacity="0.12"/>

  <!-- ═══════════ BRANCHES (back→front: outer pairs first, center last) ═══════════ -->
  <!-- B1: Amber/Gold — far left -->
  <path d="M 253,286 Q 160,235 118,141 L 122,139 Q 170,225 259,274 Z" fill="url(#b1)"/>
  <!-- B7: Coral/Orange — far right -->
  <path d="M 259,286 Q 352,235 394,141 L 390,139 Q 342,225 253,274 Z" fill="url(#b7)"/>
  <!-- B2: Emerald/Green — mid left -->
  <path d="M 251,285 Q 190,215 158,121 L 162,119 Q 200,205 261,275 Z" fill="url(#b2)"/>
  <!-- B6: Teal/Turquoise — mid right -->
  <path d="M 261,285 Q 322,215 354,121 L 350,119 Q 312,205 251,275 Z" fill="url(#b6)"/>
  <!-- B3: Purple/Violet — left center -->
  <path d="M 249,282 Q 222,203 208,106 L 212,104 Q 228,197 263,278 Z" fill="url(#b3)"/>
  <!-- B5: Rose/Magenta — right center -->
  <path d="M 263,282 Q 290,203 304,106 L 300,104 Q 284,197 249,278 Z" fill="url(#b5)"/>
  <!-- B4: Cyan/Electric Blue — center (frontmost) -->
  <path d="M 249,280 L 253.5,100 L 258.5,100 L 263,280 Z" fill="url(#b4)"/>

  <!-- ═══════════ BRANCH 3D: highlight + shadow (clipped to branch bodies) ═══════════ -->
  <g clip-path="url(#bc)">
    <!-- Highlight strokes shifted toward upper-left light source -->
    <g transform="translate(-1.5,-1.5)" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.14">
      <path d="M 256,280 Q 165,230 120,140"/>
      <path d="M 256,280 Q 195,210 160,120"/>
      <path d="M 256,280 Q 225,200 210,105"/>
      <line x1="256" y1="280" x2="256" y2="100"/>
      <path d="M 256,280 Q 287,200 302,105"/>
      <path d="M 256,280 Q 317,210 352,120"/>
      <path d="M 256,280 Q 347,230 392,140"/>
    </g>
    <!-- Shadow strokes shifted away from light source -->
    <g transform="translate(1.5,1.5)" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.1">
      <path d="M 256,280 Q 165,230 120,140"/>
      <path d="M 256,280 Q 195,210 160,120"/>
      <path d="M 256,280 Q 225,200 210,105"/>
      <line x1="256" y1="280" x2="256" y2="100"/>
      <path d="M 256,280 Q 287,200 302,105"/>
      <path d="M 256,280 Q 317,210 352,120"/>
      <path d="M 256,280 Q 347,230 392,140"/>
    </g>
  </g>

  <!-- ═══════════ FORK JUNCTION (3D sphere with glow) ═══════════ -->
  <circle cx="256" cy="280" r="28" fill="#FCD34D" opacity="0.35" filter="url(#blur)"/>
  <circle cx="256" cy="280" r="16" fill="url(#fork)"/>
  <ellipse cx="250" cy="274" rx="5" ry="4" fill="#fff" opacity="0.55"/>
  <circle cx="249" cy="273" r="2" fill="#fff" opacity="0.8"/>

  <!-- ═══════════ NODE GLASS SPHERES ═══════════ -->

  <!-- N1: Amber at (120,140) -->
  <circle cx="120" cy="140" r="26" fill="#FFD700" opacity="0.3" filter="url(#blur)"/>
  <circle cx="120" cy="140" r="18" fill="url(#n1)"/>
  <ellipse cx="114" cy="134" rx="6" ry="4.5" fill="#fff" opacity="0.5"/>
  <circle cx="113" cy="133" r="2.5" fill="#fff" opacity="0.7"/>
  <ellipse cx="120" cy="155" rx="8" ry="2.5" fill="#000" opacity="0.12"/>

  <!-- N2: Emerald at (160,120) -->
  <circle cx="160" cy="120" r="26" fill="#34D399" opacity="0.3" filter="url(#blur)"/>
  <circle cx="160" cy="120" r="18" fill="url(#n2)"/>
  <ellipse cx="154" cy="114" rx="6" ry="4.5" fill="#fff" opacity="0.5"/>
  <circle cx="153" cy="113" r="2.5" fill="#fff" opacity="0.7"/>
  <ellipse cx="160" cy="135" rx="8" ry="2.5" fill="#000" opacity="0.12"/>

  <!-- N3: Purple at (210,105) -->
  <circle cx="210" cy="105" r="26" fill="#A78BFA" opacity="0.3" filter="url(#blur)"/>
  <circle cx="210" cy="105" r="18" fill="url(#n3)"/>
  <ellipse cx="204" cy="99" rx="6" ry="4.5" fill="#fff" opacity="0.5"/>
  <circle cx="203" cy="98" r="2.5" fill="#fff" opacity="0.7"/>
  <ellipse cx="210" cy="120" rx="8" ry="2.5" fill="#000" opacity="0.12"/>

  <!-- N4: Cyan at (256,100) — center, larger -->
  <circle cx="256" cy="100" r="30" fill="#22D3EE" opacity="0.35" filter="url(#blur)"/>
  <circle cx="256" cy="100" r="22" fill="url(#n4)"/>
  <ellipse cx="249" cy="93" rx="7" ry="5.5" fill="#fff" opacity="0.5"/>
  <circle cx="248" cy="92" r="3" fill="#fff" opacity="0.7"/>
  <ellipse cx="256" cy="118" rx="10" ry="3" fill="#000" opacity="0.12"/>

  <!-- N5: Rose at (302,105) -->
  <circle cx="302" cy="105" r="26" fill="#F472B6" opacity="0.3" filter="url(#blur)"/>
  <circle cx="302" cy="105" r="18" fill="url(#n5)"/>
  <ellipse cx="296" cy="99" rx="6" ry="4.5" fill="#fff" opacity="0.5"/>
  <circle cx="295" cy="98" r="2.5" fill="#fff" opacity="0.7"/>
  <ellipse cx="302" cy="120" rx="8" ry="2.5" fill="#000" opacity="0.12"/>

  <!-- N6: Teal at (352,120) -->
  <circle cx="352" cy="120" r="26" fill="#2DD4BF" opacity="0.3" filter="url(#blur)"/>
  <circle cx="352" cy="120" r="18" fill="url(#n6)"/>
  <ellipse cx="346" cy="114" rx="6" ry="4.5" fill="#fff" opacity="0.5"/>
  <circle cx="345" cy="113" r="2.5" fill="#fff" opacity="0.7"/>
  <ellipse cx="352" cy="135" rx="8" ry="2.5" fill="#000" opacity="0.12"/>

  <!-- N7: Coral at (392,140) -->
  <circle cx="392" cy="140" r="26" fill="#FB923C" opacity="0.3" filter="url(#blur)"/>
  <circle cx="392" cy="140" r="18" fill="url(#n7)"/>
  <ellipse cx="386" cy="134" rx="6" ry="4.5" fill="#fff" opacity="0.5"/>
  <circle cx="385" cy="133" r="2.5" fill="#fff" opacity="0.7"/>
  <ellipse cx="392" cy="155" rx="8" ry="2.5" fill="#000" opacity="0.12"/>
</svg>
