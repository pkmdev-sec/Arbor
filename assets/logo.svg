<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Pitch black background circle -->
  <circle cx="256" cy="256" r="250" fill="#000000"/>

  <!-- Isolation ring (dashed boundary at ~80% radius) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#333333" stroke-width="1.5" stroke-dasharray="8 5" opacity="0.4"/>

  <!-- Connection lines from center hexagon to agent circles -->
  <line x1="256" y1="256" x2="256" y2="106" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="256" x2="399" y2="210" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="256" x2="344" y2="377" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="256" x2="168" y2="377" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="256" x2="113" y2="210" stroke="#06B6D4" stroke-width="1.5" opacity="0.5"/>

  <!-- 5 agent nodes (outer cyan circles) -->
  <circle cx="256" cy="106" r="22" fill="#06B6D4"/>
  <circle cx="399" cy="210" r="22" fill="#06B6D4"/>
  <circle cx="344" cy="377" r="22" fill="#06B6D4"/>
  <circle cx="168" cy="377" r="22" fill="#06B6D4"/>
  <circle cx="113" cy="210" r="22" fill="#06B6D4"/>

  <!-- Agent highlight specks -->
  <circle cx="250" cy="100" r="5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="393" cy="204" r="5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="338" cy="371" r="5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="162" cy="371" r="5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="107" cy="204" r="5" fill="#FFFFFF" opacity="0.5"/>

  <!-- Central orchestrator hexagon (amber) -->
  <polygon points="256,206 299,231 299,281 256,306 213,281 213,231" fill="#F59E0B"/>

  <!-- Inner hexagon glow -->
  <polygon points="256,218 288,237 288,275 256,294 224,275 224,237" fill="#FFFFFF" opacity="0.1"/>

  <!-- Center accent dot -->
  <circle cx="256" cy="256" r="8" fill="#FFFFFF" opacity="0.25"/>
</svg>
