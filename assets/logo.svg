<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#141420;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0e18;stop-opacity:1" />
    </radialGradient>

    <!-- Trunk gradient -->
    <linearGradient id="trunkGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#78350F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGradient)"/>

  <!-- Precision rings -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#1e1e30" stroke-width="1" stroke-dasharray="5 5" opacity="0.15"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1a1a2e" stroke-width="1" opacity="0.1"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.08"/>

  <!-- Subtle background dots (circular pattern) -->
  <circle cx="256" cy="140" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="331" cy="181" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="372" cy="256" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="331" cy="331" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="256" cy="372" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="181" cy="331" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="140" cy="256" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="181" cy="181" r="1.5" fill="#1a1a2e" opacity="0.3"/>
  <circle cx="293" cy="210" r="1.5" fill="#1a1a2e" opacity="0.25"/>
  <circle cx="219" cy="302" r="1.5" fill="#1a1a2e" opacity="0.25"/>

  <!-- ROOTS -->
  <line x1="248" y1="395" x2="220" y2="435" stroke="#1e293b" stroke-width="1.5" opacity="0.35"/>
  <line x1="256" y1="395" x2="256" y2="440" stroke="#1e293b" stroke-width="1.5" opacity="0.35"/>
  <line x1="264" y1="395" x2="292" y2="435" stroke="#1e293b" stroke-width="1.5" opacity="0.35"/>

  <!-- TRUNK (tapered shape with gradient) -->
  <path d="M 249 395 L 263 395 L 259 315 L 253 315 Z" fill="url(#trunkGradient)"/>
  <path d="M 253 315 L 259 315 L 257 275 L 255 275 Z" fill="url(#trunkGradient)"/>
  <path d="M 255 275 L 257 275 L 256.5 235 L 255.5 235 Z" fill="url(#trunkGradient)"/>
  <path d="M 255.5 235 L 256.5 235 L 256.3 195 L 255.7 195 Z" fill="url(#trunkGradient)"/>
  <path d="M 255.7 195 L 256.3 195 L 256 180 L 256 180 Z" fill="url(#trunkGradient)"/>

  <!-- Circuit trace lines inside trunk -->
  <line x1="251" y1="390" x2="252" y2="185" stroke="#F59E0B" stroke-width="0.5" opacity="0.15"/>
  <line x1="256" y1="390" x2="256" y2="180" stroke="#F59E0B" stroke-width="0.5" opacity="0.15"/>
  <line x1="261" y1="390" x2="260" y2="185" stroke="#F59E0B" stroke-width="0.5" opacity="0.15"/>

  <!-- Data pulse dots on trunk -->
  <circle cx="256" cy="240" r="2" fill="#F59E0B" opacity="0.3"/>
  <circle cx="256" cy="300" r="2" fill="#F59E0B" opacity="0.5"/>
  <circle cx="256" cy="360" r="2" fill="#F59E0B" opacity="0.7"/>

  <!-- BRANCHES - LEFT SIDE -->
  <!-- Level 1 (y≈195): ±22° angle, length ~85px -->
  <line x1="256" y1="195" x2="178" y2="163" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="178" y1="163" x2="175" y2="162" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 2 (y≈235): ±38° angle, length ~95px -->
  <line x1="256" y1="235" x2="168" y2="176" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="168" y1="176" x2="164" y2="173" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 3 (y≈275): ±48° angle, length ~80px -->
  <line x1="256" y1="275" x2="183" y2="216" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="183" y1="216" x2="180" y2="213" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 4 (y≈315): ±35° angle, length ~65px -->
  <line x1="256" y1="315" x2="198" y2="278" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="198" y1="278" x2="195" y2="276" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- BRANCHES - RIGHT SIDE -->
  <!-- Level 1 (y≈195): ±22° angle, length ~85px -->
  <line x1="256" y1="195" x2="334" y2="163" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="334" y1="163" x2="337" y2="162" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 2 (y≈235): ±38° angle, length ~95px -->
  <line x1="256" y1="235" x2="344" y2="176" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="344" y1="176" x2="348" y2="173" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 3 (y≈275): ±48° angle, length ~80px -->
  <line x1="256" y1="275" x2="329" y2="216" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="329" y1="216" x2="332" y2="213" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Level 4 (y≈315): ±35° angle, length ~65px -->
  <line x1="256" y1="315" x2="314" y2="278" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="314" y1="278" x2="317" y2="276" stroke="#22D3EE" stroke-width="2.5" stroke-linecap="round"/>

  <!-- CANOPY MESH (emerald network connecting endpoint nodes) -->
  <!-- Horizontal connections -->
  <line x1="175" y1="162" x2="164" y2="173" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="164" y1="173" x2="180" y2="213" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="180" y1="213" x2="195" y2="276" stroke="#10B981" stroke-width="1" opacity="0.45"/>

  <line x1="337" y1="162" x2="348" y2="173" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="348" y1="173" x2="332" y2="213" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="332" y1="213" x2="317" y2="276" stroke="#10B981" stroke-width="1" opacity="0.45"/>

  <!-- Dome arc connections -->
  <line x1="175" y1="162" x2="337" y2="162" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="164" y1="173" x2="348" y2="173" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="180" y1="213" x2="332" y2="213" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="195" y1="276" x2="317" y2="276" stroke="#10B981" stroke-width="1" opacity="0.45"/>

  <!-- Cross connections for geodesic effect -->
  <line x1="175" y1="162" x2="348" y2="173" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="337" y1="162" x2="164" y2="173" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="164" y1="173" x2="332" y2="213" stroke="#10B981" stroke-width="1" opacity="0.45"/>
  <line x1="348" y1="173" x2="180" y2="213" stroke="#10B981" stroke-width="1" opacity="0.45"/>

  <!-- NODES AT BRANCH-TRUNK JUNCTIONS (amber glow) -->
  <circle cx="256" cy="195" r="2.5" fill="#D97706" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="256" cy="235" r="2.5" fill="#D97706" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="256" cy="275" r="2.5" fill="#D97706" filter="url(#nodeGlow)" opacity="0.9"/>
  <circle cx="256" cy="315" r="2.5" fill="#D97706" filter="url(#nodeGlow)" opacity="0.9"/>

  <!-- NODES AT BRANCH ENDPOINTS (cyan glow) - LEFT SIDE -->
  <circle cx="175" cy="162" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="164" cy="173" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="180" cy="213" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="195" cy="276" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>

  <!-- NODES AT BRANCH ENDPOINTS (cyan glow) - RIGHT SIDE -->
  <circle cx="337" cy="162" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="348" cy="173" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="332" cy="213" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>
  <circle cx="317" cy="276" r="4" fill="#06B6D4" filter="url(#nodeGlow)"/>

  <!-- Central fork node (top of trunk where it splits) -->
  <circle cx="256" cy="180" r="6" fill="#06B6D4" filter="url(#strongGlow)"/>
</svg>