<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Arbor — Organic Tree Logo</title>
  <defs>
    <!-- ═══════════ CONTAINER ═══════════ -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- ═══════════ TRUNK GRADIENT ═══════════ -->
    <linearGradient id="trunk" x1="256" y1="414" x2="256" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A1506"/>
      <stop offset="25%" stop-color="#4A2810"/>
      <stop offset="60%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>

    <!-- ═══════════ MAJOR LIMB GRADIENTS ═══════════ -->
    <linearGradient id="limbL" x1="248" y1="270" x2="180" y2="198" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#7A5020"/>
    </linearGradient>
    <linearGradient id="limbC" x1="256" y1="262" x2="258" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#7A5020"/>
    </linearGradient>
    <linearGradient id="limbR" x1="264" y1="270" x2="336" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#7A5020"/>
    </linearGradient>

    <!-- ═══════════ SUB-BRANCH GRADIENTS (bark → vivid at tips) ═══════════ -->
    <linearGradient id="bAmber" x1="180" y1="200" x2="115" y2="138" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="55%" stop-color="#9B7318"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <linearGradient id="bGreen" x1="180" y1="200" x2="166" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="55%" stop-color="#3D7048"/>
      <stop offset="100%" stop-color="#2EAB6F"/>
    </linearGradient>
    <linearGradient id="bCyan" x1="258" y1="178" x2="231" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="55%" stop-color="#2A6B78"/>
      <stop offset="100%" stop-color="#1AAFCA"/>
    </linearGradient>
    <linearGradient id="bViolet" x1="258" y1="178" x2="296" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="55%" stop-color="#5A3E80"/>
      <stop offset="100%" stop-color="#8B6FC0"/>
    </linearGradient>
    <linearGradient id="bRose" x1="336" y1="202" x2="350" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="55%" stop-color="#7A3555"/>
      <stop offset="100%" stop-color="#D4588C"/>
    </linearGradient>
    <linearGradient id="bCoral" x1="336" y1="202" x2="395" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="55%" stop-color="#8A4420"/>
      <stop offset="100%" stop-color="#E8732A"/>
    </linearGradient>

    <!-- ═══════════ FILTERS ═══════════ -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- ═══════════ BRANCH CLIP PATH (for 3D highlight/shadow) ═══════════ -->
    <clipPath id="bc">
      <path d="M 248,264 C 224,244 204,224 184,196 L 176,206 C 196,232 218,254 244,274 Z"/>
      <path d="M 249,262 C 248,234 250,208 251,178 L 265,178 C 266,208 264,234 263,262 Z"/>
      <path d="M 260,264 C 284,246 306,226 334,198 L 342,208 C 314,234 292,254 268,274 Z"/>
      <path d="M 184,198 C 162,184 140,164 116,138 L 114,140 C 137,167 159,188 178,206 Z"/>
      <path d="M 177,200 C 175,174 170,148 165,112 L 167,114 C 173,150 179,176 185,202 Z"/>
      <path d="M 254,177 C 247,148 238,126 230,98 L 232,100 C 241,128 251,150 262,179 Z"/>
      <path d="M 255,176 C 268,148 282,126 295,104 L 297,106 C 284,128 271,150 261,178 Z"/>
      <path d="M 333,202 C 335,174 341,148 348,118 L 350,120 C 344,150 339,176 341,204 Z"/>
      <path d="M 334,200 C 357,188 377,170 394,144 L 396,146 C 381,172 361,194 342,208 Z"/>
    </clipPath>
  </defs>

  <!-- ═══════════ CONTAINER ═══════════ -->
  <rect x="44" y="44" width="424" height="424" rx="90" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="44" y="44" width="424" height="424" rx="90" fill="url(#vig)"/>
  <rect x="44" y="44" width="424" height="212" rx="90" fill="url(#shine)"/>
  <rect x="44.5" y="44.5" width="423" height="423" rx="89.5" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- ═══════════ TRUNK (S-curve, root flare, 3D cylinder) ═══════════ -->
  <path d="
    M 239,414
    C 238,400 237,390 239,378
    C 241,362 240,345 243,318
    C 246,290 247,275 247,262
    L 265,262
    C 265,275 266,290 269,318
    C 272,345 271,362 273,378
    C 275,390 274,400 273,414
    Z
  " fill="url(#trunk)"/>
  <!-- Trunk left highlight -->
  <path d="
    M 239,414
    C 238,400 237,390 239,378
    C 241,362 240,345 243,318
    C 246,290 247,275 247,262
    L 252,262
    C 251,275 250,290 248,318
    C 246,345 246,362 244,378
    C 242,390 243,400 243,414
    Z
  " fill="#fff" opacity="0.10"/>
  <!-- Trunk right shadow -->
  <path d="
    M 271,414
    C 272,400 273,390 271,378
    C 269,362 270,345 267,318
    C 264,290 265,275 265,262
    L 261,262
    C 261,275 262,290 264,318
    C 267,345 266,362 268,378
    C 270,390 268,400 268,414
    Z
  " fill="#000" opacity="0.10"/>

  <!-- Ground shadow -->
  <ellipse cx="256" cy="416" rx="22" ry="4" fill="#000" opacity="0.18"/>

  <!-- ═══════════ CROTCH JUNCTION ═══════════ -->
  <ellipse cx="256" cy="266" rx="18" ry="10" fill="#6B4423"/>
  <ellipse cx="253" cy="264" rx="10" ry="6" fill="#fff" opacity="0.05"/>

  <!-- ═══════════ MAJOR LIMBS (back → front) ═══════════ -->
  <!-- Left major limb -->
  <path d="
    M 248,264
    C 224,244 204,224 184,196
    L 176,206
    C 196,232 218,254 244,274
    Z
  " fill="url(#limbL)"/>
  <!-- Right major limb -->
  <path d="
    M 260,264
    C 284,246 306,226 334,198
    L 342,208
    C 314,234 292,254 268,274
    Z
  " fill="url(#limbR)"/>
  <!-- Center major limb (frontmost) -->
  <path d="
    M 249,262
    C 248,234 250,208 251,178
    L 265,178
    C 266,208 264,234 263,262
    Z
  " fill="url(#limbC)"/>

  <!-- ═══════════ SUB-BRANCHES (outer → inner) ═══════════ -->
  <!-- Amber (far left) -->
  <path d="
    M 184,198
    C 162,184 140,164 116,138
    L 114,140
    C 137,167 159,188 178,206
    Z
  " fill="url(#bAmber)"/>
  <!-- Coral (far right) -->
  <path d="
    M 334,200
    C 357,188 377,170 394,144
    L 396,146
    C 381,172 361,194 342,208
    Z
  " fill="url(#bCoral)"/>
  <!-- Green (mid left) -->
  <path d="
    M 177,200
    C 175,174 170,148 165,112
    L 167,114
    C 173,150 179,176 185,202
    Z
  " fill="url(#bGreen)"/>
  <!-- Rose (mid right) -->
  <path d="
    M 333,202
    C 335,174 341,148 348,118
    L 350,120
    C 344,150 339,176 341,204
    Z
  " fill="url(#bRose)"/>
  <!-- Cyan (center left) -->
  <path d="
    M 254,177
    C 247,148 238,126 230,98
    L 232,100
    C 241,128 251,150 262,179
    Z
  " fill="url(#bCyan)"/>
  <!-- Violet (center right) -->
  <path d="
    M 255,176
    C 268,148 282,126 295,104
    L 297,106
    C 284,128 271,150 261,178
    Z
  " fill="url(#bViolet)"/>

  <!-- ═══════════ 3D HIGHLIGHTS & SHADOWS (clipped to branch shapes) ═══════════ -->
  <g clip-path="url(#bc)">
    <!-- Highlight (shifted toward upper-left light source) -->
    <g transform="translate(-1.5,-1.5)" stroke="#fff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.12">
      <path d="M 248,270 C 224,246 204,226 180,200"/>
      <path d="M 256,262 C 256,234 258,208 258,178"/>
      <path d="M 264,270 C 288,248 310,228 336,202"/>
      <path d="M 180,200 C 160,186 140,164 115,140"/>
      <path d="M 180,200 C 178,174 172,148 166,114"/>
      <path d="M 258,178 C 250,150 240,128 231,100"/>
      <path d="M 258,178 C 270,150 284,128 296,106"/>
      <path d="M 336,202 C 338,174 344,148 350,120"/>
      <path d="M 336,202 C 358,190 378,170 395,145"/>
    </g>
    <!-- Shadow (shifted away from light source) -->
    <g transform="translate(1.5,1.5)" stroke="#000" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.08">
      <path d="M 248,270 C 224,246 204,226 180,200"/>
      <path d="M 256,262 C 256,234 258,208 258,178"/>
      <path d="M 264,270 C 288,248 310,228 336,202"/>
      <path d="M 180,200 C 160,186 140,164 115,140"/>
      <path d="M 180,200 C 178,174 172,148 166,114"/>
      <path d="M 258,178 C 250,150 240,128 231,100"/>
      <path d="M 258,178 C 270,150 284,128 296,106"/>
      <path d="M 336,202 C 338,174 344,148 350,120"/>
      <path d="M 336,202 C 358,190 378,170 395,145"/>
    </g>
  </g>

  <!-- ═══════════ FOLIAGE CLUSTERS ═══════════ -->

  <!-- Amber cluster at (115, 139) -->
  <circle cx="115" cy="137" r="22" fill="#DAA520" opacity="0.18"/>
  <circle cx="115" cy="137" r="22" fill="none" stroke="#DAA520" stroke-width="1.5" opacity="0.23"/>
  <circle cx="109" cy="134" r="8" fill="#FFE44D" opacity="0.85"/>
  <circle cx="120" cy="131" r="7" fill="#FFD700" opacity="0.9"/>
  <circle cx="107" cy="142" r="6.5" fill="#FFC107" opacity="0.8"/>
  <circle cx="121" cy="141" r="6" fill="#FFE44D" opacity="0.75"/>
  <circle cx="114" cy="127" r="5.5" fill="#FFED80" opacity="0.7"/>

  <!-- Green cluster at (166, 113) -->
  <circle cx="166" cy="111" r="22" fill="#2EAB6F" opacity="0.18"/>
  <circle cx="166" cy="111" r="22" fill="none" stroke="#2EAB6F" stroke-width="1.5" opacity="0.23"/>
  <circle cx="160" cy="108" r="8" fill="#5DEAAD" opacity="0.85"/>
  <circle cx="170" cy="105" r="7" fill="#34D399" opacity="0.9"/>
  <circle cx="158" cy="116" r="6.5" fill="#2CC98E" opacity="0.8"/>
  <circle cx="173" cy="113" r="6" fill="#5DEAAD" opacity="0.75"/>

  <!-- Cyan cluster at (231, 99) — center, slightly larger -->
  <circle cx="231" cy="97" r="25" fill="#1AAFCA" opacity="0.18"/>
  <circle cx="231" cy="97" r="25" fill="none" stroke="#1AAFCA" stroke-width="1.5" opacity="0.23"/>
  <circle cx="224" cy="94" r="9" fill="#5CE0F0" opacity="0.85"/>
  <circle cx="234" cy="91" r="8" fill="#22D3EE" opacity="0.9"/>
  <circle cx="228" cy="103" r="7" fill="#1DC5DE" opacity="0.8"/>
  <circle cx="238" cy="99" r="6.5" fill="#5CE0F0" opacity="0.75"/>
  <circle cx="231" cy="87" r="6" fill="#80E8F5" opacity="0.7"/>

  <!-- Violet cluster at (296, 105) -->
  <circle cx="296" cy="103" r="22" fill="#8B6FC0" opacity="0.18"/>
  <circle cx="296" cy="103" r="22" fill="none" stroke="#8B6FC0" stroke-width="1.5" opacity="0.23"/>
  <circle cx="290" cy="100" r="8" fill="#C4A8FF" opacity="0.85"/>
  <circle cx="300" cy="97" r="7" fill="#A78BFA" opacity="0.9"/>
  <circle cx="288" cy="108" r="6.5" fill="#9B7EF0" opacity="0.8"/>
  <circle cx="303" cy="105" r="6" fill="#C4A8FF" opacity="0.75"/>

  <!-- Rose cluster at (349, 119) -->
  <circle cx="349" cy="117" r="22" fill="#D4588C" opacity="0.18"/>
  <circle cx="349" cy="117" r="22" fill="none" stroke="#D4588C" stroke-width="1.5" opacity="0.23"/>
  <circle cx="343" cy="114" r="8" fill="#F89CC8" opacity="0.85"/>
  <circle cx="353" cy="111" r="7" fill="#F472B6" opacity="0.9"/>
  <circle cx="341" cy="122" r="6.5" fill="#E85FA8" opacity="0.8"/>
  <circle cx="356" cy="119" r="6" fill="#F89CC8" opacity="0.75"/>

  <!-- Coral cluster at (395, 145) -->
  <circle cx="395" cy="143" r="22" fill="#E8732A" opacity="0.18"/>
  <circle cx="395" cy="143" r="22" fill="none" stroke="#E8732A" stroke-width="1.5" opacity="0.23"/>
  <circle cx="389" cy="139" r="8" fill="#FCA75C" opacity="0.85"/>
  <circle cx="399" cy="137" r="7" fill="#FB923C" opacity="0.9"/>
  <circle cx="387" cy="148" r="6.5" fill="#F08030" opacity="0.8"/>
  <circle cx="402" cy="145" r="6" fill="#FCA75C" opacity="0.75"/>
  <circle cx="396" cy="133" r="5.5" fill="#FDBD7D" opacity="0.7"/>
</svg>
