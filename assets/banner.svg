<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rect -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGradient)" stroke="#1e293b" stroke-width="2"/>

  <!-- Decorative background dots -->
  <circle cx="900" cy="80" r="2" fill="#06B6D4" opacity="0.1"/>
  <circle cx="1050" cy="120" r="2" fill="#06B6D4" opacity="0.1"/>
  <circle cx="780" cy="180" r="2" fill="#06B6D4" opacity="0.1"/>
  <circle cx="950" cy="240" r="2" fill="#06B6D4" opacity="0.1"/>

  <!-- LEFT SECTION: Logo -->
  <!-- Outer decorative ring -->
  <circle cx="150" cy="150" r="125" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.2"/>

  <!-- Dark circle frame -->
  <circle cx="150" cy="150" r="110" fill="#0a0f1a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Geometric tree logo -->
  <g transform="translate(150, 150)">
    <!-- Trunk (amber) - 6 triangles -->
    <polygon points="-8,60 8,60 0,40" fill="#D97706"/>
    <polygon points="-8,40 8,40 0,20" fill="#F59E0B"/>
    <polygon points="-10,20 10,20 0,0" fill="#D97706"/>
    <polygon points="-8,0 8,0 0,-20" fill="#F59E0B"/>
    <polygon points="-10,-20 10,-20 0,-35" fill="#D97706"/>
    <polygon points="-8,-35 8,-35 0,-45" fill="#F59E0B"/>

    <!-- Lower branches (cyan) - left side -->
    <polygon points="-10,-30 -25,-10 -35,-15" fill="#0891B2"/>
    <polygon points="-25,-10 -35,-5 -45,-12" fill="#06B6D4"/>
    <polygon points="-35,-15 -45,-12 -52,-20" fill="#0891B2"/>

    <!-- Lower branches (cyan) - right side -->
    <polygon points="10,-30 25,-10 35,-15" fill="#0891B2"/>
    <polygon points="25,-10 35,-5 45,-12" fill="#06B6D4"/>
    <polygon points="35,-15 45,-12 52,-20" fill="#0891B2"/>

    <!-- Upper branches (cyan) - left side -->
    <polygon points="-8,-45 -20,-35 -28,-42" fill="#06B6D4"/>
    <polygon points="-20,-35 -30,-30 -38,-38" fill="#0891B2"/>
    <polygon points="-30,-30 -38,-28 -45,-35" fill="#06B6D4"/>

    <!-- Upper branches (cyan) - right side -->
    <polygon points="8,-45 20,-35 28,-42" fill="#06B6D4"/>
    <polygon points="20,-35 30,-30 38,-38" fill="#0891B2"/>
    <polygon points="30,-30 38,-28 45,-35" fill="#06B6D4"/>

    <!-- Canopy (emerald) - top clusters -->
    <polygon points="-25,-42 -15,-50 -20,-58" fill="#10B981"/>
    <polygon points="-15,-50 -5,-55 -10,-63" fill="#059669"/>
    <polygon points="-5,-55 5,-60 0,-70" fill="#10B981"/>
    <polygon points="5,-60 15,-55 10,-63" fill="#059669"/>
    <polygon points="15,-55 25,-50 20,-58" fill="#10B981"/>
    <polygon points="25,-50 35,-45 30,-53" fill="#059669"/>

    <!-- Canopy lower layer -->
    <polygon points="-35,-38 -25,-45 -30,-52" fill="#059669"/>
    <polygon points="-18,-48 -8,-53 -13,-60" fill="#10B981"/>
    <polygon points="-3,-58 7,-62 2,-68" fill="#059669"/>
    <polygon points="8,-53 18,-48 13,-60" fill="#10B981"/>
    <polygon points="25,-45 35,-38 30,-52" fill="#059669"/>
    <polygon points="38,-40 48,-38 42,-48" fill="#10B981"/>

    <!-- Glowing cyan dot at fork point -->
    <circle cx="0" cy="-30" r="3" fill="#06B6D4" opacity="0.9"/>
    <circle cx="0" cy="-30" r="5" fill="#06B6D4" opacity="0.3"/>
  </g>

  <!-- RIGHT SECTION: Text -->
  <!-- Title -->
  <text x="320" y="145" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="96" font-weight="800" fill="#F59E0B" letter-spacing="8">ARBOR</text>

  <!-- Subtitle -->
  <text x="325" y="185" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="400" fill="#64748B" letter-spacing="6">MULTI-AGENT ORCHESTRATOR</text>

  <!-- Tagline -->
  <text x="325" y="220" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#475569" letter-spacing="1">worktree isolation / fork-join concurrency / verified merge</text>

  <!-- Version badge -->
  <rect x="325" y="237" width="50" height="22" rx="4" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.6"/>
  <text x="350" y="252" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#F59E0B" opacity="0.7" text-anchor="middle">v1.0</text>

  <!-- Decorative horizontal line -->
  <line x1="310" y1="260" x2="1100" y2="260" stroke="#1e293b" opacity="0.3"/>
</svg>