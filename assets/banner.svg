<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180">
  <defs>
    <linearGradient id="bbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7aa2f7"/>
      <stop offset="100%" style="stop-color:#bb9af7"/>
    </linearGradient>
  </defs>

  <!-- Background with border -->
  <rect width="800" height="180" rx="10" fill="url(#bbg)" stroke="#30363d" stroke-width="1"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="800" height="3" rx="10" fill="url(#accent)"/>

  <!-- Logo mark -->
  <circle cx="80" cy="90" r="35" fill="#7aa2f7" opacity="0.08"/>
  <circle cx="80" cy="90" r="24" fill="#7aa2f7" opacity="0.12"/>
  <!-- Agent dots around logo -->
  <circle cx="80" cy="50" r="5" fill="#3fb950"/>
  <circle cx="115" cy="72" r="5" fill="#3fb950"/>
  <circle cx="115" cy="108" r="5" fill="#3fb950"/>
  <circle cx="80" cy="130" r="4" fill="#f85149"/>
  <circle cx="45" cy="108" r="5" fill="#3fb950"/>
  <circle cx="45" cy="72" r="4" fill="#d29922"/>
  <!-- Lines -->
  <line x1="80" y1="68" x2="80" y2="55" stroke="#7aa2f7" stroke-width="0.8" opacity="0.4"/>
  <line x1="96" y1="80" x2="110" y2="74" stroke="#7aa2f7" stroke-width="0.8" opacity="0.4"/>
  <line x1="96" y1="100" x2="110" y2="106" stroke="#7aa2f7" stroke-width="0.8" opacity="0.4"/>
  <line x1="80" y1="112" x2="80" y2="125" stroke="#f85149" stroke-width="0.8" opacity="0.4"/>
  <line x1="64" y1="100" x2="50" y2="106" stroke="#7aa2f7" stroke-width="0.8" opacity="0.4"/>
  <line x1="64" y1="80" x2="50" y2="74" stroke="#d29922" stroke-width="0.8" opacity="0.4"/>
  <!-- Center text -->
  <text x="80" y="94" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace,monospace" font-size="18" font-weight="700">RA</text>

  <!-- Title block -->
  <text x="150" y="58" fill="#e6edf3" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="32" font-weight="700">remote-agent</text>

  <text x="150" y="85" fill="#7aa2f7" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="14">Autonomous Claude Code executor with parallel swarm orchestration</text>

  <text x="150" y="108" fill="#8b949e" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans,Helvetica,Arial,sans-serif" font-size="12">Fresh 1M context per agent  ·  AI-powered routing  ·  Hook enforcement  ·  Completion contracts</text>

  <!-- Tag pills -->
  <rect x="150" y="125" width="72" height="22" rx="11" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="186" y="140" text-anchor="middle" fill="#3fb950" font-family="ui-monospace,monospace" font-size="10">sonnet 1M</text>

  <rect x="232" y="125" width="62" height="22" rx="11" fill="#bb9af7" opacity="0.15" stroke="#bb9af7" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="263" y="140" text-anchor="middle" fill="#bb9af7" font-family="ui-monospace,monospace" font-size="10">opus 1M</text>

  <rect x="304" y="125" width="54" height="22" rx="11" fill="#7aa2f7" opacity="0.15" stroke="#7aa2f7" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="331" y="140" text-anchor="middle" fill="#7aa2f7" font-family="ui-monospace,monospace" font-size="10">swarm</text>

  <rect x="368" y="125" width="62" height="22" rx="11" fill="#d29922" opacity="0.15" stroke="#d29922" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="399" y="140" text-anchor="middle" fill="#d29922" font-family="ui-monospace,monospace" font-size="10">enforced</text>

  <rect x="440" y="125" width="52" height="22" rx="11" fill="#f85149" opacity="0.15" stroke="#f85149" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="466" y="140" text-anchor="middle" fill="#f85149" font-family="ui-monospace,monospace" font-size="10">verify</text>
</svg>
