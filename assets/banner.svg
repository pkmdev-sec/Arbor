<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <title>Arbor — Multi-Agent Orchestrator</title>
  <defs>
    <!-- Background gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.4"/>
    </radialGradient>

    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Trunk gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#c0c0c0"/>
    </linearGradient>

    <!-- Fork junction gradient -->
    <radialGradient id="forkGrad">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>

    <!-- Glass sphere gradients - 3D effect -->
    <radialGradient id="glassLeft" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#909090"/>
    </radialGradient>

    <radialGradient id="glassCenter" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ebebeb"/>
      <stop offset="100%" stop-color="#959595"/>
    </radialGradient>

    <radialGradient id="glassRight" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#909090"/>
    </radialGradient>

    <!-- Typography gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="separator" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#FCD34D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="containerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="forkGlow">
      <feGaussianBlur stdDeviation="6"/>
      <feColorMatrix values="1 0 0 0 0  0 0.8 0 0 0  0 0 0.2 0 0  0 0 0 0.5 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="sphereGlow">
      <feGaussianBlur stdDeviation="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Full dark gradient background -->
  <rect width="1200" height="300" fill="url(#bgGrad)"/>
  <rect width="1200" height="300" fill="url(#vignette)"/>

  <!-- LEFT SIDE: Squircle container with tree -->
  <rect x="50" y="50" width="200" height="200" rx="44" fill="url(#bgGrad)" filter="url(#containerShadow)"/>
  <rect x="50" y="50" width="200" height="200" rx="44" fill="url(#vignette)"/>
  <rect x="50" y="50" width="200" height="100" rx="44" fill="url(#glassShine)"/>
  <rect x="50.5" y="50.5" width="199" height="199" rx="43.5" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Tree structure scaled proportionally -->
  <!-- Trunk line -->
  <line x1="150" y1="215" x2="150" y2="152" stroke="url(#trunkGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Three branches -->
  <g stroke="#e8e8e8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 150 152 Q 129 130 108 108"/>
    <line x1="150" y1="150" x2="150" y2="92"/>
    <path d="M 150 152 Q 171 130 192 108"/>
  </g>

  <!-- Fork junction with golden glow -->
  <circle cx="150" cy="152" r="7" fill="url(#forkGrad)" filter="url(#forkGlow)"/>
  <circle cx="147" cy="149" r="2" fill="#fff" opacity="0.5"/>

  <!-- Left glass sphere node -->
  <g filter="url(#sphereGlow)">
    <circle cx="108" cy="108" r="11" fill="url(#glassLeft)"/>
  </g>
  <ellipse cx="104" cy="104" rx="4" ry="3" fill="#fff" opacity="0.5"/>
  <circle cx="103.5" cy="103.5" r="1.5" fill="#fff" opacity="0.65"/>
  <ellipse cx="108" cy="114" rx="5" ry="1.5" fill="#000" opacity="0.15"/>

  <!-- Center glass sphere node (primary, largest) -->
  <g filter="url(#sphereGlow)">
    <circle cx="150" cy="90" r="13" fill="url(#glassCenter)"/>
  </g>
  <ellipse cx="146" cy="86" rx="4.5" ry="3.5" fill="#fff" opacity="0.5"/>
  <circle cx="145.5" cy="85.5" r="1.5" fill="#fff" opacity="0.65"/>
  <ellipse cx="150" cy="98" rx="6" ry="1.8" fill="#000" opacity="0.15"/>

  <!-- Right glass sphere node -->
  <g filter="url(#sphereGlow)">
    <circle cx="192" cy="108" r="11" fill="url(#glassRight)"/>
  </g>
  <ellipse cx="188" cy="104" rx="4" ry="3" fill="#fff" opacity="0.5"/>
  <circle cx="187.5" cy="103.5" r="1.5" fill="#fff" opacity="0.65"/>
  <ellipse cx="192" cy="114" rx="5" ry="1.5" fill="#000" opacity="0.15"/>

  <!-- RIGHT SIDE: Typography -->
  <text x="310" y="148" font-family="system-ui,-apple-system,sans-serif" font-size="80" font-weight="700" fill="url(#titleGrad)" letter-spacing="10">ARBOR</text>
  <text x="310" y="180" font-family="system-ui,-apple-system,sans-serif" font-size="15" font-weight="400" fill="#9CA3AF" letter-spacing="6">MULTI-AGENT ORCHESTRATOR</text>
  <text x="310" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#6B7280" letter-spacing="1">worktree isolation &#183; fork-join concurrency &#183; verified merge</text>

  <!-- Thin decorative line -->
  <line x1="310" y1="232" x2="1100" y2="232" stroke="url(#separator)" stroke-width="1"/>
</svg>
