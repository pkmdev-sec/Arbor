<svg xmlns="http://www.w3.org/2000/svg" width="700" height="550" viewBox="0 0 700 550">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7aa2f7"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f85149"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  </defs>
  <rect width="700" height="550" rx="8" fill="#0d1117"/>
  <text x="350" y="28" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15" font-weight="700">System Architecture</text>

  <!-- User -->
  <rect x="265" y="45" width="170" height="35" rx="6" fill="#161b22" stroke="#30363d"/>
  <text x="350" y="67" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="12" font-weight="600">User Prompt</text>

  <line x1="350" y1="80" x2="350" y2="100" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Orchestrator -->
  <rect x="220" y="105" width="260" height="55" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="350" y="128" text-anchor="middle" fill="#d29922" font-family="system-ui,sans-serif" font-size="12" font-weight="700">AI Orchestrator (Haiku 4.5)</text>
  <text x="350" y="148" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">classifies task · creates bd ticket · writes DELEGATE state</text>

  <!-- Fork: DIRECT vs DELEGATE -->
  <line x1="280" y1="160" x2="150" y2="190" stroke="#3fb950" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="420" y1="160" x2="500" y2="190" stroke="#f85149" stroke-width="1.5" marker-end="url(#r)"/>

  <!-- DIRECT path -->
  <rect x="60" y="195" width="180" height="35" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="150" y="210" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="11" font-weight="600">DIRECT</text>
  <text x="150" y="222" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">questions · follow-ups · trivial</text>

  <!-- DELEGATE path -->
  <rect x="410" y="195" width="230" height="35" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="525" y="210" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="11" font-weight="600">DELEGATE (enforced)</text>
  <text x="525" y="222" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">ALL tools blocked except allowlisted Bash</text>

  <line x1="525" y1="230" x2="525" y2="255" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Swarm -->
  <rect x="370" y="260" width="310" height="45" rx="6" fill="#161b22" stroke="#bb9af7" stroke-width="1.5"/>
  <text x="525" y="280" text-anchor="middle" fill="#bb9af7" font-family="system-ui,sans-serif" font-size="12" font-weight="700">Swarm Controller</text>
  <text x="525" y="296" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">decompose → parallel execute → verify → report</text>

  <!-- Agent boxes -->
  <line x1="420" y1="305" x2="120" y2="345" stroke="#7aa2f7" stroke-width="1" marker-end="url(#a)"/>
  <line x1="460" y1="305" x2="310" y2="345" stroke="#7aa2f7" stroke-width="1" marker-end="url(#a)"/>
  <line x1="570" y1="305" x2="500" y2="345" stroke="#7aa2f7" stroke-width="1" marker-end="url(#a)"/>

  <rect x="30" y="350" width="175" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="117" y="370" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Agent 01 (sonnet 1M)</text>
  <text x="117" y="388" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">src/models/ · fresh context</text>

  <rect x="220" y="350" width="175" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="307" y="370" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Agent 02 (sonnet 1M)</text>
  <text x="307" y="388" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">src/services/ · fresh context</text>

  <rect x="410" y="350" width="175" height="50" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
  <text x="497" y="370" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Agent 03 (sonnet 1M)</text>
  <text x="497" y="388" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">src/components/ · fresh context</text>

  <!-- Verifier -->
  <line x1="620" y1="305" x2="620" y2="345" stroke="#f85149" stroke-width="1" marker-end="url(#r)"/>
  <rect x="560" y="350" width="120" height="50" rx="6" fill="#161b22" stroke="#f85149" stroke-width="1"/>
  <text x="620" y="370" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Verifier (opus)</text>
  <text x="620" y="388" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">cross-checks diffs</text>

  <!-- Results merge -->
  <line x1="117" y1="400" x2="350" y2="435" stroke="#3fb950" stroke-width="1" marker-end="url(#g)"/>
  <line x1="307" y1="400" x2="350" y2="435" stroke="#3fb950" stroke-width="1" marker-end="url(#g)"/>
  <line x1="497" y1="400" x2="350" y2="435" stroke="#3fb950" stroke-width="1" marker-end="url(#g)"/>
  <line x1="620" y1="400" x2="380" y2="435" stroke="#f85149" stroke-width="1" marker-end="url(#r)"/>

  <rect x="260" y="440" width="180" height="40" rx="6" fill="#161b22" stroke="#7aa2f7" stroke-width="1.5"/>
  <text x="350" y="457" text-anchor="middle" fill="#7aa2f7" font-family="system-ui,sans-serif" font-size="11" font-weight="600">Completion Contract</text>
  <text x="350" y="472" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">merged results + verdict</text>

  <line x1="350" y1="480" x2="350" y2="510" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="350" y="530" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="10">Main session reads 2KB summary (not 200KB of raw files)</text>
</svg>
