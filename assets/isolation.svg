<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#7aa2f7"/>
    </marker>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#3fb950"/>
    </marker>
    <marker id="red-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="450" rx="8" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="16" font-weight="700">3-Layer Isolation Model</text>

  <!-- BEFORE Section -->
  <rect x="20" y="60" width="250" height="360" rx="6" fill="#161b22" stroke="#7aa2f7" stroke-width="2"/>
  <text x="145" y="85" text-anchor="middle" fill="#7aa2f7" font-family="system-ui,sans-serif" font-size="14" font-weight="700">BEFORE</text>
  <text x="145" y="103" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Snapshot</text>

  <!-- Snapshot box -->
  <rect x="40" y="120" width="210" height="80" rx="4" fill="#1a1b26" stroke="#30363d"/>
  <text x="145" y="140" text-anchor="middle" fill="#bb9af7" font-family="monospace" font-size="11" font-weight="600">File Hashes (SHA-256)</text>
  <text x="145" y="158" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">src/index.mjs: a3f2...</text>
  <text x="145" y="173" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">src/utils.mjs: 7b8c...</text>
  <text x="145" y="188" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">README.md: 2d91...</text>

  <!-- Backup box -->
  <rect x="40" y="220" width="210" height="80" rx="4" fill="#1a1b26" stroke="#30363d"/>
  <text x="145" y="240" text-anchor="middle" fill="#9ece6a" font-family="monospace" font-size="11" font-weight="600">Backup Created</text>
  <text x="145" y="258" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">/tmp/backup-xyz/</text>
  <text x="145" y="273" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">├── src/index.mjs</text>
  <text x="145" y="288" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">└── src/utils.mjs</text>

  <!-- Worktree creation -->
  <rect x="40" y="320" width="210" height="80" rx="4" fill="#1a1b26" stroke="#30363d"/>
  <text x="145" y="340" text-anchor="middle" fill="#7dcfff" font-family="monospace" font-size="11" font-weight="600">Worktree Ready</text>
  <text x="145" y="358" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">git worktree add</text>
  <text x="145" y="373" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">node_modules → symlink</text>
  <text x="145" y="388" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">untracked files copied</text>

  <!-- Arrow to DURING -->
  <line x1="270" y1="220" x2="310" y2="220" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DURING Section -->
  <rect x="315" y="60" width="250" height="360" rx="6" fill="#161b22" stroke="#bb9af7" stroke-width="2"/>
  <text x="440" y="85" text-anchor="middle" fill="#bb9af7" font-family="system-ui,sans-serif" font-size="14" font-weight="700">DURING</text>
  <text x="440" y="103" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Agent Execution</text>

  <!-- Worktree container (dotted boundary) -->
  <rect x="330" y="120" width="220" height="200" rx="4" fill="none" stroke="#e0af68" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="440" y="140" text-anchor="middle" fill="#e0af68" font-family="monospace" font-size="11" font-weight="600">Isolated Worktree</text>

  <!-- Agent inside worktree -->
  <circle cx="440" cy="180" r="30" fill="#7aa2f7" opacity="0.2"/>
  <text x="440" y="185" text-anchor="middle" fill="#7aa2f7" font-family="monospace" font-size="16" font-weight="700">AI</text>

  <!-- Agent activity -->
  <text x="440" y="225" text-anchor="middle" fill="#9ece6a" font-family="monospace" font-size="9">✓ Edit src/index.mjs</text>
  <text x="440" y="240" text-anchor="middle" fill="#9ece6a" font-family="monospace" font-size="9">✓ Write src/new.mjs</text>
  <text x="440" y="255" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">✓ Run tests</text>
  <text x="440" y="285" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">node_modules/ (symlinked)</text>
  <text x="440" y="300" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">.git → detached HEAD</text>

  <!-- Escape detection warning -->
  <rect x="330" y="335" width="220" height="70" rx="4" fill="#1a1b26" stroke="#f85149" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="440" y="353" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="10" font-weight="600">⚠ Escape Detection</text>
  <text x="440" y="369" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Absolute path writes</text>
  <text x="440" y="382" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Post-snapshot hash check</text>
  <text x="440" y="395" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">→ Rollback if violated</text>

  <!-- Arrow to AFTER -->
  <line x1="565" y1="220" x2="605" y2="220" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AFTER Section -->
  <rect x="610" y="60" width="270" height="360" rx="6" fill="#161b22" stroke="#7aa2f7" stroke-width="2"/>
  <text x="745" y="85" text-anchor="middle" fill="#7aa2f7" font-family="system-ui,sans-serif" font-size="14" font-weight="700">AFTER</text>
  <text x="745" y="103" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Validation & Apply</text>

  <!-- Validation gate -->
  <rect x="625" y="120" width="240" height="60" rx="4" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1"/>
  <text x="745" y="140" text-anchor="middle" fill="#bb9af7" font-family="monospace" font-size="11" font-weight="600">Validation Gate</text>
  <text x="745" y="158" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">node --check *.{mjs,js}</text>
  <text x="745" y="171" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="9">hash comparison</text>

  <!-- Green path: PASS -->
  <line x1="680" y1="180" x2="680" y2="210" stroke="#3fb950" stroke-width="2" marker-end="url(#green-arrow)"/>
  <rect x="625" y="215" width="110" height="90" rx="4" fill="#1a1b26" stroke="#3fb950" stroke-width="2"/>
  <text x="680" y="235" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="13" font-weight="700">✓ PASS</text>
  <text x="680" y="253" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Syntax valid</text>
  <text x="680" y="266" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">No escapes</text>
  <line x1="680" y1="305" x2="680" y2="330" stroke="#3fb950" stroke-width="2" marker-end="url(#green-arrow)"/>
  <rect x="625" y="335" width="110" height="65" rx="4" fill="#052e16" stroke="#3fb950" stroke-width="1"/>
  <text x="680" y="353" text-anchor="middle" fill="#3fb950" font-family="monospace" font-size="10" font-weight="600">Apply to Main</text>
  <text x="680" y="368" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Copy files</text>
  <text x="680" y="381" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Cleanup worktree</text>
  <text x="680" y="394" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Remove backup</text>

  <!-- Red path: FAIL -->
  <line x1="810" y1="180" x2="810" y2="210" stroke="#f85149" stroke-width="2" marker-end="url(#red-arrow)"/>
  <rect x="755" y="215" width="110" height="90" rx="4" fill="#1a1b26" stroke="#f85149" stroke-width="2"/>
  <text x="810" y="235" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="13" font-weight="700">✗ FAIL</text>
  <text x="810" y="253" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Syntax error</text>
  <text x="810" y="266" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">OR escaped</text>
  <line x1="810" y1="305" x2="810" y2="330" stroke="#f85149" stroke-width="2" marker-end="url(#red-arrow)"/>
  <rect x="755" y="335" width="110" height="65" rx="4" fill="#2d0a0e" stroke="#f85149" stroke-width="1"/>
  <text x="810" y="353" text-anchor="middle" fill="#f85149" font-family="monospace" font-size="10" font-weight="600">Rollback</text>
  <text x="810" y="368" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Restore backup</text>
  <text x="810" y="381" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Discard worktree</text>
  <text x="810" y="394" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="8">Report failure</text>
</svg>
