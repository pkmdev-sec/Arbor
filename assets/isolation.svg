<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="960" height="420" fill="#0d0d14" rx="12"/>

  <!-- Definitions for arrow markers -->
  <defs>
    <!-- Gray arrow -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a4a6a"/>
    </marker>
    <!-- Red arrow -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF4444"/>
    </marker>
    <!-- Green arrow -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Column headers -->
  <text x="160" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" letter-spacing="3" text-anchor="middle">BEFORE</text>
  <text x="480" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" letter-spacing="3" text-anchor="middle">DURING</text>
  <text x="800" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#6b7280" letter-spacing="3" text-anchor="middle">AFTER</text>

  <!-- Vertical separators -->
  <line x1="320" y1="50" x2="320" y2="400" stroke="#1a1a2a" stroke-width="1" stroke-dasharray="6 4"/>
  <line x1="640" y1="50" x2="640" y2="400" stroke="#1a1a2a" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- BEFORE COLUMN -->
  <!-- Box 1: Record Snapshot -->
  <rect x="40" y="70" width="240" height="52" fill="#252535" rx="8"/>
  <text x="160" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Record Snapshot</text>
  <text x="160" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">SHA-256 · mtime pre-filter</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="122" x2="160" y2="149" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Box 2: Create Worktree -->
  <rect x="40" y="155" width="240" height="52" fill="#252535" rx="8"/>
  <text x="160" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Create Worktree</text>
  <text x="160" y="192" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">git worktree add · isolated branch</text>

  <!-- Arrow 2 -->
  <line x1="160" y1="207" x2="160" y2="234" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Box 3: Build Contract -->
  <rect x="40" y="240" width="240" height="52" fill="#252535" rx="8"/>
  <text x="160" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Build Contract</text>
  <text x="160" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">task scope · allowed paths · timeout</text>

  <!-- DURING COLUMN -->
  <!-- Isolation boundary -->
  <rect x="350" y="55" width="260" height="240" fill="none" stroke="#4a4a6a" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.35" rx="12"/>
  <text x="480" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" opacity="0.5" text-anchor="middle">isolation boundary</text>

  <!-- Inside boundary - Agent Executes -->
  <rect x="370" y="85" width="220" height="55" fill="#252535" rx="8"/>
  <text x="480" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#06B6D4" text-anchor="middle">Agent Executes</text>
  <text x="480" y="123" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">fresh 1M context · no shared state</text>

  <!-- Arrow down inside boundary -->
  <line x1="480" y1="140" x2="480" y2="169" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Inside boundary - File Modifications -->
  <rect x="370" y="175" width="220" height="50" fill="#252535" rx="8"/>
  <text x="480" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">File Modifications</text>
  <text x="480" y="211" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">scoped to worktree only</text>

  <!-- Escape Detection box (outside boundary) -->
  <rect x="370" y="335" width="220" height="48" fill="#252535" rx="8"/>
  <text x="480" y="354" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">Escape Detection</text>
  <text x="480" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">hash mismatch → abort</text>

  <!-- Red dashed arrow from boundary to escape detection -->
  <line x1="480" y1="295" x2="480" y2="329" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)"/>

  <!-- AFTER COLUMN -->
  <!-- Validate Changes -->
  <rect x="660" y="80" width="240" height="52" fill="#252535" rx="8"/>
  <text x="780" y="101" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Validate Changes</text>
  <text x="780" y="117" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">syntax check · lint · type check</text>

  <!-- Arrow to decision -->
  <line x1="780" y1="132" x2="780" y2="159" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Decision diamond -->
  <path d="M 780 165 L 795 180 L 780 195 L 765 180 Z" fill="#252535" stroke="#4a4a6a" stroke-width="1.5"/>

  <!-- Success path - to Apply -->
  <line x1="795" y1="180" x2="810" y2="180" stroke="#10B981" stroke-width="1.5"/>
  <line x1="810" y1="180" x2="810" y2="214" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="820" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#10B981">pass</text>

  <!-- Apply box (only filled accent box) -->
  <rect x="760" y="220" width="100" height="44" fill="#10B981" rx="8"/>
  <text x="810" y="246" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0d0d14" text-anchor="middle">Apply</text>
  <text x="810" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">three-way merge to main</text>

  <!-- Failure path - to Rollback -->
  <line x1="780" y1="195" x2="780" y2="245" stroke="#EF4444" stroke-width="1.5"/>
  <line x1="780" y1="245" x2="720" y2="245" stroke="#EF4444" stroke-width="1.5"/>
  <line x1="720" y1="245" x2="720" y2="309" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="750" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#EF4444">fail</text>

  <!-- Rollback box -->
  <rect x="660" y="315" width="120" height="44" fill="#252535" rx="8"/>
  <text x="720" y="341" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#EF4444" text-anchor="middle">Rollback</text>
  <text x="720" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">restore from backup</text>
</svg>
