<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="boxAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-amber" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.15"/>
    </filter>
    <filter id="glow-cyan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.15"/>
    </filter>
    <filter id="glow-emerald" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#10B981" flood-opacity="0.15"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#3b4563"/>
    </marker>
    <marker id="arrA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#F59E0B"/>
    </marker>
    <marker id="arrC" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#06B6D4"/>
    </marker>
    <marker id="arrE" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#10B981"/>
    </marker>
    <marker id="arrR" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#F43F5E"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2.5">ISOLATION LAYERS</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER 1: WORKTREE ISOLATION (top band)         -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="24" y="48" width="752" height="130" rx="12" fill="#0c1222" stroke="#1c2640" stroke-width="0.75" filter="url(#shadow)"/>
  <text x="46" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F59E0B" letter-spacing="1.5" opacity="0.9">LAYER 1 &middot; WORKTREE ISOLATION</text>

  <!-- Record Snapshot box -->
  <rect x="44" y="82" width="220" height="80" rx="10" fill="url(#boxAmber)" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-amber)"/>
  <text x="154" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" text-anchor="middle">Record Snapshot</text>
  <text x="154" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">SHA-256 hash of all files</text>
  <text x="154" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">mtime pre-filter for speed</text>

  <!-- Arrow 1→2 -->
  <line x1="264" y1="122" x2="292" y2="122" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrA)"/>

  <!-- Create Worktree box -->
  <rect x="298" y="82" width="220" height="80" rx="10" fill="url(#boxAmber)" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-amber)"/>
  <text x="408" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" text-anchor="middle">Create Worktree</text>
  <text x="408" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">git worktree add</text>
  <text x="408" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">isolated branch &middot; clean state</text>

  <!-- Arrow 2→3 -->
  <line x1="518" y1="122" x2="546" y2="122" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrA)"/>

  <!-- Build Contract box -->
  <rect x="552" y="82" width="206" height="80" rx="10" fill="url(#boxAmber)" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-amber)"/>
  <text x="655" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" text-anchor="middle">Build Contract</text>
  <text x="655" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">task scope &middot; allowed paths</text>
  <text x="655" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">timeout &middot; resource limits</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER 2: SNAPSHOT VALIDATION (middle band)     -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="24" y="196" width="752" height="130" rx="12" fill="#0c1222" stroke="#1c2640" stroke-width="0.75" filter="url(#shadow)"/>
  <text x="46" y="216" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#06B6D4" letter-spacing="1.5" opacity="0.9">LAYER 2 &middot; SNAPSHOT VALIDATION</text>

  <!-- Vertical arrows from Layer 1 to Layer 2 -->
  <line x1="400" y1="178" x2="400" y2="196" stroke="#3b4563" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Agent Executes box -->
  <rect x="44" y="230" width="260" height="80" rx="10" fill="url(#boxCyan)" stroke="#06B6D4" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-cyan)"/>
  <text x="174" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#06B6D4" text-anchor="middle">Agent Executes</text>
  <text x="174" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">fresh 1M context window</text>
  <text x="174" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">no shared state &middot; scoped to worktree</text>

  <!-- Arrow: Agent → Validate -->
  <line x1="304" y1="270" x2="332" y2="270" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrC)"/>

  <!-- Hash Validation box -->
  <rect x="338" y="230" width="200" height="80" rx="10" fill="url(#boxCyan)" stroke="#06B6D4" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-cyan)"/>
  <text x="438" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#06B6D4" text-anchor="middle">Hash Validation</text>
  <text x="438" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">compare post hashes</text>
  <text x="438" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">detect out-of-scope changes</text>

  <!-- Escape Detection box -->
  <rect x="570" y="230" width="190" height="80" rx="10" fill="url(#boxRose)" stroke="#F43F5E" stroke-opacity="0.25" stroke-width="0.75"/>
  <text x="665" y="254" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F43F5E" text-anchor="middle">Escape Detection</text>
  <text x="665" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">hash mismatch detected</text>
  <text x="665" y="284" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#F43F5E" opacity="0.7" text-anchor="middle">abort &amp; rollback</text>

  <!-- Arrow: Validate → Escape (dashed) -->
  <line x1="538" y1="270" x2="564" y2="270" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="4 3" marker-end="url(#arrR)"/>
  <text x="551" y="261" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#F43F5E" text-anchor="middle" opacity="0.7">fail</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER 3: SYNTAX-GATED MERGE (bottom band)     -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="24" y="344" width="752" height="150" rx="12" fill="#0c1222" stroke="#1c2640" stroke-width="0.75" filter="url(#shadow)"/>
  <text x="46" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#10B981" letter-spacing="1.5" opacity="0.9">LAYER 3 &middot; SYNTAX-GATED MERGE</text>

  <!-- Vertical arrows from Layer 2 to Layer 3 -->
  <line x1="300" y1="326" x2="300" y2="344" stroke="#3b4563" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Syntax Check box -->
  <rect x="44" y="380" width="180" height="80" rx="10" fill="url(#boxEmerald)" stroke="#10B981" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-emerald)"/>
  <text x="134" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#10B981" text-anchor="middle">Syntax Check</text>
  <text x="134" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">parse all changed files</text>
  <text x="134" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">lint &middot; type check</text>

  <!-- Arrow: Syntax → Decision -->
  <line x1="224" y1="420" x2="268" y2="420" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrE)"/>

  <!-- Decision diamond -->
  <path d="M 290 420 L 310 400 L 330 420 L 310 440 Z" fill="#0c1222" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
  <text x="310" y="424" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">?</text>

  <!-- Pass path: Decision → Apply -->
  <line x1="330" y1="420" x2="370" y2="420" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.6" marker-end="url(#arrE)"/>
  <text x="350" y="411" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#10B981" text-anchor="middle">pass</text>

  <!-- Apply box (accent filled) -->
  <rect x="376" y="392" width="180" height="56" rx="10" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" filter="url(#glow-emerald)"/>
  <text x="466" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#10B981" text-anchor="middle">Apply</text>
  <text x="466" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">three-way merge to main</text>

  <!-- Fail path: Decision → Rollback -->
  <line x1="310" y1="440" x2="310" y2="460" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="310" y1="460" x2="640" y2="460" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="640" y1="460" x2="640" y2="438" stroke="#F43F5E" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrR)"/>
  <text x="318" y="454" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#F43F5E">fail</text>

  <!-- Rollback box -->
  <rect x="580" y="380" width="178" height="56" rx="10" fill="url(#boxRose)" stroke="#F43F5E" stroke-opacity="0.25" stroke-width="0.75"/>
  <text x="669" y="404" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F43F5E" text-anchor="middle">Rollback</text>
  <text x="669" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">restore from snapshot</text>
  <text x="669" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">delete worktree branch</text>
</svg>
