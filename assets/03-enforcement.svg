<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <rect width="700" height="400" rx="8" fill="#0d1117"/>
  <text x="350" y="28" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15" font-weight="700">Hook Enforcement — Why Text Directives Failed</text>

  <!-- Left: 5 failed attempts -->
  <text x="175" y="58" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="12" font-weight="600">5 Attempts That Failed</text>

  <rect x="30" y="70" width="290" height="28" rx="4" fill="#f85149" opacity="0.1" stroke="#f85149" stroke-width="0.5"/>
  <text x="40" y="88" fill="#f85149" font-family="monospace" font-size="9">v1 Hook text: "MANDATORY: Use remote agent" → IGNORED</text>

  <rect x="30" y="103" width="290" height="28" rx="4" fill="#f85149" opacity="0.1" stroke="#f85149" stroke-width="0.5"/>
  <text x="40" y="121" fill="#f85149" font-family="monospace" font-size="9">v2 MCP server: remote_research tool → TIMED OUT</text>

  <rect x="30" y="136" width="290" height="28" rx="4" fill="#f85149" opacity="0.1" stroke="#f85149" stroke-width="0.5"/>
  <text x="40" y="154" fill="#f85149" font-family="monospace" font-size="9">v3 CLI wrapper: bash script → TOO SIMPLE</text>

  <rect x="30" y="169" width="290" height="28" rx="4" fill="#f85149" opacity="0.1" stroke="#f85149" stroke-width="0.5"/>
  <text x="40" y="187" fill="#f85149" font-family="monospace" font-size="9">v4 Pre-computed cmds: "RUN: swarm ..." → IGNORED</text>

  <rect x="30" y="202" width="290" height="28" rx="4" fill="#f85149" opacity="0.1" stroke="#f85149" stroke-width="0.5"/>
  <text x="40" y="220" fill="#f85149" font-family="monospace" font-size="9">v5 Compound matcher: {Agent,Read} → PARTIAL</text>

  <text x="175" y="255" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">Key learning: text injection cannot override tool selection</text>

  <!-- Right: what works -->
  <text x="525" y="58" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="12" font-weight="600">What Actually Works (v6)</text>

  <rect x="380" y="70" width="290" height="35" rx="4" fill="#3fb950" opacity="0.1" stroke="#3fb950" stroke-width="0.5"/>
  <text x="390" y="85" fill="#3fb950" font-family="monospace" font-size="9">PreToolUse: {"decision":"block"}</text>
  <text x="390" y="98" fill="#8b949e" font-family="monospace" font-size="8">Claude CANNOT call blocked tools</text>

  <rect x="380" y="112" width="290" height="35" rx="4" fill="#7aa2f7" opacity="0.1" stroke="#7aa2f7" stroke-width="0.5"/>
  <text x="390" y="127" fill="#7aa2f7" font-family="monospace" font-size="9">Individual matchers (not compound)</text>
  <text x="390" y="140" fill="#8b949e" font-family="monospace" font-size="8">Agent, Read, Glob, Grep, Bash — each separate</text>

  <rect x="380" y="154" width="290" height="35" rx="4" fill="#d29922" opacity="0.1" stroke="#d29922" stroke-width="0.5"/>
  <text x="390" y="169" fill="#d29922" font-family="monospace" font-size="9">Bash ALLOWLIST (not blocklist)</text>
  <text x="390" y="182" fill="#8b949e" font-family="monospace" font-size="8">Only swarm/remote-agent/bd/git pass through</text>

  <rect x="380" y="196" width="290" height="35" rx="4" fill="#bb9af7" opacity="0.1" stroke="#bb9af7" stroke-width="0.5"/>
  <text x="390" y="211" fill="#bb9af7" font-family="monospace" font-size="9">Fail-CLOSED (not fail-open)</text>
  <text x="390" y="224" fill="#8b949e" font-family="monospace" font-size="8">Any hook error → tool blocked for safety</text>

  <!-- State machine -->
  <text x="350" y="285" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="13" font-weight="600">Delegation State Machine</text>

  <rect x="50" y="300" width="140" height="40" rx="20" fill="#f85149" opacity="0.15" stroke="#f85149"/>
  <text x="120" y="325" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="11" font-weight="600">DELEGATE</text>

  <rect x="280" y="300" width="140" height="40" rx="20" fill="#3fb950" opacity="0.15" stroke="#3fb950"/>
  <text x="350" y="325" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="11" font-weight="600">FULFILLED</text>

  <rect x="510" y="300" width="140" height="40" rx="20" fill="#7aa2f7" opacity="0.15" stroke="#7aa2f7"/>
  <text x="580" y="325" text-anchor="middle" fill="#7aa2f7" font-family="system-ui,sans-serif" font-size="11" font-weight="600">DIRECT</text>

  <line x1="190" y1="320" x2="275" y2="320" stroke="#3fb950" stroke-width="1.5" marker-end="url(#g)"/>
  <text x="232" y="312" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8">swarm ran</text>

  <text x="350" y="365" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="9">All tools blocked</text>
  <text x="350" y="380" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9">(except allowlisted Bash)</text>

  <text x="580" y="365" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="9">All tools allowed</text>
</svg>
