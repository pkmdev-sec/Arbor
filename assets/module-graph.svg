<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480">
  <!-- FENRIS dark background -->
  <rect width="960" height="480" fill="#0d0d14" rx="12"/>

  <!-- Define arrow markers (uniform gray) -->
  <defs>
    <marker id="arrow-gray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#4a4a6a"/>
    </marker>
  </defs>

  <!-- Layer labels (uppercase, letter-spaced, gray) -->
  <text x="20" y="50" font-family="system-ui" font-size="11" fill="#6b7280" letter-spacing="2" font-weight="500">ENTRY</text>
  <text x="20" y="150" font-family="system-ui" font-size="11" fill="#6b7280" letter-spacing="2" font-weight="500">CORE</text>
  <text x="20" y="260" font-family="system-ui" font-size="11" fill="#6b7280" letter-spacing="2" font-weight="500">MID</text>
  <text x="20" y="380" font-family="system-ui" font-size="11" fill="#6b7280" letter-spacing="2" font-weight="500">LEAF</text>

  <!-- Layer separators (subtle dark lines) -->
  <line x1="100" y1="110" x2="860" y2="110" stroke="#1a1a2a" stroke-width="1"/>
  <line x1="100" y1="220" x2="860" y2="220" stroke="#1a1a2a" stroke-width="1"/>
  <line x1="100" y1="340" x2="860" y2="340" stroke="#1a1a2a" stroke-width="1"/>

  <!-- DEPENDENCY ARROWS (all uniform gray #4a4a6a, drawn behind boxes) -->

  <!-- Entry → Core (stroke-width=2) -->
  <!-- agent-entry → orchestration -->
  <path d="M 270,80 Q 270,115 280,130" fill="none" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- swarm → orchestration -->
  <path d="M 650,80 Q 520,105 360,130" fill="none" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- swarm → isolation -->
  <path d="M 690,80 Q 690,105 690,130" fill="none" stroke="#4a4a6a" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Entry → Mid (stroke-width=1.5) -->
  <!-- swarm → agent-spawn -->
  <path d="M 640,80 Q 480,150 300,240" fill="none" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- swarm → lifecycle -->
  <path d="M 660,80 Q 560,150 435,240" fill="none" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- swarm → cli -->
  <path d="M 620,80 Q 400,150 130,240" fill="none" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- agent-entry → cli -->
  <path d="M 220,80 Q 180,150 115,240" fill="none" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- agent-entry → context-bridge -->
  <path d="M 310,80 Q 440,150 590,240" fill="none" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- agent-entry → lifecycle -->
  <path d="M 290,80 Q 350,150 420,240" fill="none" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- agent-entry → telemetry -->
  <path d="M 330,80 Q 530,150 760,240" fill="none" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Core → Mid (stroke-width=1) -->
  <!-- orchestration → agent-spawn -->
  <path d="M 280,180 Q 280,210 280,240" fill="none" stroke="#4a4a6a" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <!-- orchestration → context-bridge -->
  <path d="M 350,180 Q 470,210 610,240" fill="none" stroke="#4a4a6a" stroke-width="1" marker-end="url(#arrow-gray)"/>

  <!-- orchestration → isolation (dashed horizontal) -->
  <path d="M 390,155 Q 520,155 600,155" fill="none" stroke="#4a4a6a" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>

  <!-- LAYER 1 - ENTRY (y=30-100) -->
  <!-- agent-entry.mjs (left-center) -->
  <rect x="180" y="30" width="180" height="50" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="270" y="50" font-family="system-ui" font-size="13" fill="#F59E0B" font-weight="bold" text-anchor="middle">agent-entry.mjs</text>
  <text x="270" y="65" font-family="system-ui" font-size="10" fill="#6b7280" text-anchor="middle">arbor CLI</text>

  <!-- swarm.mjs (right-center) -->
  <rect x="600" y="30" width="160" height="50" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="680" y="50" font-family="system-ui" font-size="13" fill="#F59E0B" font-weight="bold" text-anchor="middle">swarm.mjs</text>
  <text x="680" y="65" font-family="system-ui" font-size="10" fill="#6b7280" text-anchor="middle">arbor-swarm CLI</text>

  <!-- LAYER 2 - CORE (y=130-200) -->
  <!-- orchestration.mjs (left-center) -->
  <rect x="190" y="130" width="200" height="50" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="290" y="150" font-family="system-ui" font-size="13" fill="#06B6D4" font-weight="bold" text-anchor="middle">orchestration.mjs</text>
  <text x="290" y="165" font-family="system-ui" font-size="9" fill="#6b7280" text-anchor="middle">decompose · execute · verify</text>

  <!-- isolation.mjs (right-center) -->
  <rect x="600" y="130" width="180" height="50" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="690" y="150" font-family="system-ui" font-size="13" fill="#06B6D4" font-weight="bold" text-anchor="middle">isolation.mjs</text>
  <text x="690" y="165" font-family="system-ui" font-size="9" fill="#6b7280" text-anchor="middle">worktree · snapshot · merge</text>

  <!-- LAYER 3 - MID (y=240-310) -->
  <!-- cli.mjs -->
  <rect x="60" y="240" width="100" height="48" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="110" y="268" font-family="system-ui" font-size="12" fill="#e2e8f0" text-anchor="middle">cli.mjs</text>

  <!-- agent-spawn.mjs -->
  <rect x="205" y="240" width="150" height="48" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="280" y="268" font-family="system-ui" font-size="12" fill="#e2e8f0" text-anchor="middle">agent-spawn.mjs</text>

  <!-- lifecycle.mjs -->
  <rect x="370" y="240" width="130" height="48" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="435" y="268" font-family="system-ui" font-size="12" fill="#e2e8f0" text-anchor="middle">lifecycle.mjs</text>

  <!-- context-bridge.mjs -->
  <rect x="530" y="240" width="160" height="48" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="610" y="268" font-family="system-ui" font-size="12" fill="#e2e8f0" text-anchor="middle">context-bridge.mjs</text>

  <!-- telemetry.mjs -->
  <rect x="720" y="240" width="130" height="48" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="785" y="268" font-family="system-ui" font-size="12" fill="#e2e8f0" text-anchor="middle">telemetry.mjs</text>

  <!-- LAYER 4 - LEAF (y=360-420) -->
  <!-- output.mjs -->
  <rect x="330" y="360" width="130" height="48" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="395" y="388" font-family="system-ui" font-size="12" fill="#6b7280" text-anchor="middle">output.mjs</text>

  <!-- config.mjs -->
  <rect x="500" y="360" width="120" height="48" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="560" y="388" font-family="system-ui" font-size="12" fill="#6b7280" text-anchor="middle">config.mjs</text>

  <!-- Footnote -->
  <text x="480" y="435" font-family="system-ui" font-size="10" fill="#4a5568" font-style="italic" text-anchor="middle">* all modules import output.mjs and config.mjs</text>
</svg>
