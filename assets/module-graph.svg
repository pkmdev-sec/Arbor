<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <!-- Dark background -->
  <rect width="960" height="540" fill="#0D1117" rx="12"/>

  <!-- Define arrow markers -->
  <defs>
    <!-- Cyan marker for Entry→Core -->
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#06B6D4" opacity="0.7"/>
    </marker>
    <!-- Slate marker for Entry→Mid -->
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569" opacity="0.4"/>
    </marker>
    <!-- Cyan thin marker for Core→Mid -->
    <marker id="arrow-cyan-thin" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#06B6D4" opacity="0.4"/>
    </marker>
  </defs>

  <!-- Layer labels -->
  <text x="20" y="65" font-family="monospace" font-size="10" fill="#333">ENTRY</text>
  <text x="20" y="190" font-family="monospace" font-size="10" fill="#333">CORE</text>
  <text x="20" y="320" font-family="monospace" font-size="10" fill="#333">MID</text>
  <text x="20" y="460" font-family="monospace" font-size="10" fill="#333">LEAF</text>

  <!-- Layer separators -->
  <line x1="100" y1="115" x2="860" y2="115" stroke="#1e293b" opacity="0.5" stroke-width="1"/>
  <line x1="100" y1="245" x2="860" y2="245" stroke="#1e293b" opacity="0.5" stroke-width="1"/>
  <line x1="100" y1="385" x2="860" y2="385" stroke="#1e293b" opacity="0.5" stroke-width="1"/>

  <!-- DEPENDENCY ARROWS (drawn first, behind boxes) -->

  <!-- Entry → Core (thick cyan) -->
  <!-- swarm → orchestration (curve down-left) -->
  <path d="M 580,94 Q 480,120 350,155" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.7" marker-end="url(#arrow-cyan)"/>

  <!-- swarm → isolation (straight down) -->
  <path d="M 640,94 Q 640,125 640,155" fill="none" stroke="#06B6D4" stroke-width="2.5" opacity="0.7" marker-end="url(#arrow-cyan)"/>

  <!-- agent-entry → orchestration (curve down-right, thinner) -->
  <path d="M 320,94 Q 320,125 310,155" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.7" marker-end="url(#arrow-cyan)"/>

  <!-- Entry → Mid (medium slate) -->
  <!-- swarm → agent-spawn -->
  <path d="M 600,94 Q 480,180 280,280" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-slate)"/>

  <!-- swarm → lifecycle -->
  <path d="M 620,94 Q 550,180 430,280" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-slate)"/>

  <!-- swarm → cli -->
  <path d="M 570,94 Q 400,180 100,280" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-slate)"/>

  <!-- agent-entry → cli -->
  <path d="M 240,94 Q 180,180 85,280" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-slate)"/>

  <!-- agent-entry → context-bridge -->
  <path d="M 340,94 Q 450,180 580,280" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-slate)"/>

  <!-- agent-entry → lifecycle -->
  <path d="M 310,94 Q 370,180 420,280" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-slate)"/>

  <!-- agent-entry → telemetry -->
  <path d="M 360,94 Q 550,180 770,280" fill="none" stroke="#475569" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-slate)"/>

  <!-- Core → Mid (thin cyan) -->
  <!-- orchestration → agent-spawn -->
  <path d="M 280,207 Q 280,240 250,280" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-cyan-thin)"/>

  <!-- orchestration → context-bridge -->
  <path d="M 360,207 Q 480,240 600,280" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.4" marker-end="url(#arrow-cyan-thin)"/>

  <!-- orchestration → isolation (dashed horizontal-ish) -->
  <path d="M 380,181 Q 470,181 560,181" fill="none" stroke="#06B6D4" stroke-width="1.5" opacity="0.4" stroke-dasharray="4,3" marker-end="url(#arrow-cyan-thin)"/>

  <!-- LAYER 1 - Entry Points -->
  <!-- agent-entry.mjs -->
  <rect x="200" y="42" width="180" height="52" rx="10" fill="#161b22" stroke="#F59E0B" stroke-width="2"/>
  <text x="290" y="65" font-family="system-ui" font-size="13" fill="#F59E0B" font-weight="bold" text-anchor="middle">agent-entry.mjs</text>
  <text x="290" y="80" font-family="system-ui" font-size="10" fill="#64748B" text-anchor="middle">arbor CLI</text>

  <!-- swarm.mjs -->
  <rect x="560" y="42" width="160" height="52" rx="10" fill="#161b22" stroke="#F59E0B" stroke-width="2"/>
  <text x="640" y="65" font-family="system-ui" font-size="13" fill="#F59E0B" font-weight="bold" text-anchor="middle">swarm.mjs</text>
  <text x="640" y="80" font-family="system-ui" font-size="10" fill="#64748B" text-anchor="middle">arbor-swarm CLI</text>

  <!-- LAYER 2 - Core Modules -->
  <!-- orchestration.mjs -->
  <rect x="180" y="155" width="200" height="52" rx="10" fill="#161b22" stroke="#06B6D4" stroke-width="2"/>
  <text x="280" y="177" font-family="system-ui" font-size="13" fill="#06B6D4" font-weight="bold" text-anchor="middle">orchestration.mjs</text>
  <text x="280" y="192" font-family="system-ui" font-size="9" fill="#64748B" text-anchor="middle">decompose · execute · verify</text>

  <!-- isolation.mjs -->
  <rect x="560" y="155" width="180" height="52" rx="10" fill="#161b22" stroke="#06B6D4" stroke-width="2"/>
  <text x="650" y="177" font-family="system-ui" font-size="13" fill="#06B6D4" font-weight="bold" text-anchor="middle">isolation.mjs</text>
  <text x="650" y="192" font-family="system-ui" font-size="9" fill="#64748B" text-anchor="middle">worktree · snapshot · merge</text>

  <!-- LAYER 3 - Mid Modules -->
  <!-- cli.mjs -->
  <rect x="30" y="280" width="110" height="48" rx="8" fill="#161b22" stroke="#475569" stroke-width="2"/>
  <text x="85" y="308" font-family="system-ui" font-size="12" fill="#E2E8F0" text-anchor="middle">cli.mjs</text>

  <!-- agent-spawn.mjs -->
  <rect x="170" y="280" width="160" height="48" rx="8" fill="#161b22" stroke="#475569" stroke-width="2"/>
  <text x="250" y="308" font-family="system-ui" font-size="12" fill="#E2E8F0" text-anchor="middle">agent-spawn.mjs</text>

  <!-- lifecycle.mjs -->
  <rect x="360" y="280" width="140" height="48" rx="8" fill="#161b22" stroke="#475569" stroke-width="2"/>
  <text x="430" y="308" font-family="system-ui" font-size="12" fill="#E2E8F0" text-anchor="middle">lifecycle.mjs</text>

  <!-- context-bridge.mjs -->
  <rect x="530" y="280" width="170" height="48" rx="8" fill="#161b22" stroke="#475569" stroke-width="2"/>
  <text x="615" y="308" font-family="system-ui" font-size="12" fill="#E2E8F0" text-anchor="middle">context-bridge.mjs</text>

  <!-- telemetry.mjs -->
  <rect x="730" y="280" width="140" height="48" rx="8" fill="#161b22" stroke="#475569" stroke-width="2"/>
  <text x="800" y="308" font-family="system-ui" font-size="12" fill="#E2E8F0" text-anchor="middle">telemetry.mjs</text>

  <!-- LAYER 4 - Leaf Modules -->
  <!-- output.mjs -->
  <rect x="280" y="420" width="140" height="48" rx="8" fill="#161b22" stroke="#333" stroke-width="2"/>
  <text x="350" y="448" font-family="system-ui" font-size="12" fill="#64748B" text-anchor="middle">output.mjs</text>

  <!-- config.mjs -->
  <rect x="540" y="420" width="130" height="48" rx="8" fill="#161b22" stroke="#333" stroke-width="2"/>
  <text x="605" y="448" font-family="system-ui" font-size="12" fill="#64748B" text-anchor="middle">config.mjs</text>

  <!-- Footnote -->
  <text x="480" y="520" font-family="system-ui" font-size="10" fill="#475569" font-style="italic" text-anchor="middle">* all modules import output.mjs and config.mjs</text>
</svg>
