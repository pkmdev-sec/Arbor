<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="boxAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow-amber" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-cyan" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#06B6D4" flood-opacity="0.12"/>
    </filter>
    <filter id="glow-violet" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.12"/>
    </filter>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#3b4563"/>
    </marker>
    <marker id="arrA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#F59E0B" opacity="0.6"/>
    </marker>
    <marker id="arrC" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#06B6D4" opacity="0.6"/>
    </marker>
    <marker id="arrV" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#8B5CF6" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2.5">MODULE DEPENDENCY GRAPH</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER LABELS (left sidebar)                    -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="26" y="74" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#F59E0B" letter-spacing="1.5" opacity="0.7">ENTRY</text>
  <text x="26" y="184" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#06B6D4" letter-spacing="1.5" opacity="0.7">CORE</text>
  <text x="26" y="304" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#8B5CF6" letter-spacing="1.5" opacity="0.7">MID</text>
  <text x="26" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1.5" opacity="0.7">LEAF</text>

  <!-- Layer separator lines -->
  <line x1="70" y1="120" x2="776" y2="120" stroke="#1c2640" stroke-width="0.5" opacity="0.6"/>
  <line x1="70" y1="240" x2="776" y2="240" stroke="#1c2640" stroke-width="0.5" opacity="0.6"/>
  <line x1="70" y1="370" x2="776" y2="370" stroke="#1c2640" stroke-width="0.5" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ENTRY LAYER (y=48–110)                         -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- agent-entry.mjs -->
  <rect x="120" y="48" width="220" height="60" rx="10" fill="url(#boxAmber)" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="0.75" filter="url(#glow-amber)"/>
  <text x="230" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" text-anchor="middle">agent-entry.mjs</text>
  <text x="230" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">arbor CLI entry point</text>

  <!-- swarm.mjs -->
  <rect x="460" y="48" width="220" height="60" rx="10" fill="url(#boxAmber)" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="0.75" filter="url(#glow-amber)"/>
  <text x="570" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" text-anchor="middle">swarm.mjs</text>
  <text x="570" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">arbor-swarm CLI entry point</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CORE LAYER (y=140–220)                         -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- orchestration.mjs -->
  <rect x="100" y="148" width="240" height="60" rx="10" fill="url(#boxCyan)" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="0.75" filter="url(#glow-cyan)"/>
  <text x="220" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#06B6D4" text-anchor="middle">orchestration.mjs</text>
  <text x="220" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">decompose &middot; execute &middot; verify</text>

  <!-- isolation.mjs -->
  <rect x="480" y="148" width="220" height="60" rx="10" fill="url(#boxCyan)" stroke="#06B6D4" stroke-opacity="0.25" stroke-width="0.75" filter="url(#glow-cyan)"/>
  <text x="590" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#06B6D4" text-anchor="middle">isolation.mjs</text>
  <text x="590" y="190" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">worktree &middot; snapshot &middot; merge</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- MID LAYER (y=260–330)                          -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- cli.mjs -->
  <rect x="70" y="268" width="110" height="52" rx="10" fill="url(#boxViolet)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-violet)"/>
  <text x="125" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="middle">cli.mjs</text>

  <!-- agent-spawn.mjs -->
  <rect x="200" y="268" width="140" height="52" rx="10" fill="url(#boxViolet)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-violet)"/>
  <text x="270" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="middle">agent-spawn</text>

  <!-- lifecycle.mjs -->
  <rect x="360" y="268" width="120" height="52" rx="10" fill="url(#boxViolet)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-violet)"/>
  <text x="420" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="middle">lifecycle</text>

  <!-- context-bridge.mjs -->
  <rect x="500" y="268" width="140" height="52" rx="10" fill="url(#boxViolet)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-violet)"/>
  <text x="570" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="middle">context-bridge</text>

  <!-- telemetry.mjs -->
  <rect x="660" y="268" width="110" height="52" rx="10" fill="url(#boxViolet)" stroke="#8B5CF6" stroke-opacity="0.2" stroke-width="0.75" filter="url(#glow-violet)"/>
  <text x="715" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#8B5CF6" text-anchor="middle">telemetry</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LEAF LAYER (y=388–440)                         -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- output.mjs -->
  <rect x="250" y="396" width="140" height="52" rx="10" fill="url(#boxSlate)" stroke="#475569" stroke-opacity="0.25" stroke-width="0.75"/>
  <text x="320" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">output.mjs</text>

  <!-- config.mjs -->
  <rect x="420" y="396" width="140" height="52" rx="10" fill="url(#boxSlate)" stroke="#475569" stroke-opacity="0.25" stroke-width="0.75"/>
  <text x="490" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">config.mjs</text>

  <!-- Footnote -->
  <text x="400" y="478" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-style="italic">all modules import output.mjs and config.mjs</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- DEPENDENCY ARROWS                              -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Entry → Core arrows (amber, thicker) -->
  <!-- agent-entry → orchestration -->
  <path d="M230,108 L230,120 Q230,130 225,138 L222,142" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.35" marker-end="url(#arrA)"/>

  <!-- swarm → orchestration -->
  <path d="M520,108 L520,120 Q520,130 420,138 L346,142" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.35" marker-end="url(#arrA)"/>

  <!-- swarm → isolation -->
  <path d="M590,108 L590,120 Q590,130 590,138 L590,142" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.35" marker-end="url(#arrA)"/>

  <!-- Entry → Mid arrows (amber, thinner) -->
  <!-- agent-entry → cli -->
  <path d="M180,108 Q170,190 135,262" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" marker-end="url(#arrA)"/>

  <!-- agent-entry → lifecycle -->
  <path d="M260,108 Q340,200 415,262" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" marker-end="url(#arrA)"/>

  <!-- agent-entry → context-bridge -->
  <path d="M300,108 Q420,200 555,262" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" marker-end="url(#arrA)"/>

  <!-- agent-entry → telemetry -->
  <path d="M330,108 Q540,200 700,262" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" marker-end="url(#arrA)"/>

  <!-- swarm → agent-spawn -->
  <path d="M510,108 Q400,200 282,262" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" marker-end="url(#arrA)"/>

  <!-- swarm → cli -->
  <path d="M490,108 Q300,200 140,262" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" marker-end="url(#arrA)"/>

  <!-- swarm → lifecycle -->
  <path d="M540,108 Q480,200 425,262" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.2" marker-end="url(#arrA)"/>

  <!-- Core → Mid arrows (cyan, thin) -->
  <!-- orchestration → agent-spawn -->
  <path d="M220,208 Q220,240 268,262" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.25" marker-end="url(#arrC)"/>

  <!-- orchestration → context-bridge -->
  <path d="M300,208 Q420,240 555,262" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.25" marker-end="url(#arrC)"/>

  <!-- orchestration ↔ isolation (dashed horizontal) -->
  <path d="M340,178 Q420,178 474,178" fill="none" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="4 3" marker-end="url(#arrC)"/>

  <!-- Mid → Leaf arrows (violet, very thin) -->
  <!-- cli → output -->
  <path d="M140,320 Q220,360 305,390" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.2" marker-end="url(#arrV)"/>
  <!-- lifecycle → config -->
  <path d="M420,320 Q450,360 480,390" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.2" marker-end="url(#arrV)"/>
  <!-- agent-spawn → output -->
  <path d="M270,320 Q290,360 312,390" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.2" marker-end="url(#arrV)"/>
  <!-- telemetry → config -->
  <path d="M700,320 Q600,360 505,390" fill="none" stroke="#8B5CF6" stroke-width="0.75" stroke-opacity="0.2" marker-end="url(#arrV)"/>
</svg>
