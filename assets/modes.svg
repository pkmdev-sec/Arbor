    <line x1="490" y1="133" x2="520" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="490" y1="164" x2="520" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="490" y1="195" x2="520" y2="154" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

