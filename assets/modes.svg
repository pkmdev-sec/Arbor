    <text x="460" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06B6D4" text-anchor="middle">Agent</text>

    <rect x="430" y="182" width="60" height="26" rx="4" fill="#161b22" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="460" y="199" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06B6D4" text-anchor="middle">Agent</text>

