  <line x1="343" y1="128" x2="361" y2="128" stroke="#3b4563" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="365" y="114" width="78" height="28" rx="7" fill="#151c30" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.35"/>
  <text x="404" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle" font-weight="500">Agent</text>
  <line x1="445" y1="128" x2="463" y2="128" stroke="#3b4563" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)"/>
  <rect x="467" y="114" width="78" height="28" rx="7" fill="#151c30" stroke="#242e4c" stroke-width="0.5"/>
  <text x="506" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" font-weight="500">Result</text>

