    <line x1="490" y1="349" x2="520" y2="339" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="490" y1="380" x2="520" y2="339" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

