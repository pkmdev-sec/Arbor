    <!-- Result box -->
    <rect x="570" y="415" width="90" height="38" rx="6" fill="#161b22" stroke="#10B981" stroke-width="1.5"/>
    <text x="615" y="438" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#10B981" text-anchor="middle">Result</text>

