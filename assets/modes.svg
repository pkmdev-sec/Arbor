<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-navy { fill: #0F172A; }
      .stroke-cyan { stroke: #06B6D4; stroke-width: 2; }
      .fill-cyan { fill: #06B6D4; }
      .fill-amber { fill: #F59E0B; }
      .fill-purple { fill: #8B5CF6; }
      .fill-green { fill: #10B981; }
      .fill-slate { fill: #94A3B8; }
      .text-white { fill: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-xs { font-size: 11px; }
      .text-sm { font-size: 13px; }
      .text-md { font-size: 14px; font-weight: 600; }
      .node { rx: 6; stroke-width: 2; }
      .arrow { stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#06B6D4" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" class="bg-navy"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" class="text-white" font-size="20" font-weight="700">Execution Modes</text>

  <!-- SINGLE MODE -->
  <g transform="translate(0, 60)">
    <text x="20" y="35" class="text-white text-md">SINGLE</text>

    <rect x="150" y="15" width="100" height="40" class="node fill-slate" stroke="#94A3B8"/>
    <text x="200" y="32" text-anchor="middle" class="text-white text-sm">Task</text>
    <text x="200" y="46" text-anchor="middle" class="text-white text-xs">One agent</text>

    <line x1="250" y1="35" x2="310" y2="35" class="stroke-cyan arrow"/>

    <rect x="310" y="15" width="100" height="40" class="node fill-green" stroke="#10B981"/>
    <text x="360" y="32" text-anchor="middle" class="text-white text-sm">Result</text>
    <text x="360" y="46" text-anchor="middle" class="text-white text-xs">Direct output</text>
  </g>

  <!-- PARALLEL MODE -->
  <g transform="translate(0, 150)">
    <text x="20" y="50" class="text-white text-md">PARALLEL</text>

    <rect x="150" y="30" width="100" height="40" class="node fill-purple" stroke="#8B5CF6"/>
    <text x="200" y="47" text-anchor="middle" class="text-white text-sm">Decompose</text>
    <text x="200" y="61" text-anchor="middle" class="text-white text-xs">Split task</text>

    <!-- Worker 1 -->
    <line x1="250" y1="40" x2="310" y2="25" class="stroke-cyan arrow"/>
    <rect x="310" y="5" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="355" y="22" text-anchor="middle" class="text-white text-sm">Worker 1</text>
    <text x="355" y="36" text-anchor="middle" class="text-white text-xs">Subtask A</text>

    <!-- Worker 2 -->
    <line x1="250" y1="50" x2="310" y2="50" class="stroke-cyan arrow"/>
    <rect x="310" y="50" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="355" y="67" text-anchor="middle" class="text-white text-sm">Worker 2</text>
    <text x="355" y="81" text-anchor="middle" class="text-white text-xs">Subtask B</text>

    <!-- Worker 3 -->
    <line x1="250" y1="60" x2="310" y2="75" class="stroke-cyan arrow"/>
    <rect x="310" y="95" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="355" y="112" text-anchor="middle" class="text-white text-sm">Worker 3</text>
    <text x="355" y="126" text-anchor="middle" class="text-white text-xs">Subtask C</text>

    <!-- Merge -->
    <line x1="400" y1="25" x2="460" y2="50" class="stroke-cyan arrow"/>
    <line x1="400" y1="70" x2="460" y2="50" class="stroke-cyan arrow"/>
    <line x1="400" y1="115" x2="460" y2="50" class="stroke-cyan arrow"/>

    <rect x="460" y="30" width="100" height="40" class="node fill-green" stroke="#10B981"/>
    <text x="510" y="47" text-anchor="middle" class="text-white text-sm">Merge</text>
    <text x="510" y="61" text-anchor="middle" class="text-white text-xs">Combine results</text>
  </g>

  <!-- PIPELINE MODE -->
  <g transform="translate(0, 280)">
    <text x="20" y="25" class="text-white text-md">PIPELINE</text>

    <rect x="150" y="5" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="195" y="22" text-anchor="middle" class="text-white text-sm">Research</text>
    <text x="195" y="36" text-anchor="middle" class="text-white text-xs">Agent 1</text>

    <line x1="240" y1="25" x2="270" y2="25" class="stroke-cyan arrow"/>

    <rect x="270" y="5" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="315" y="22" text-anchor="middle" class="text-white text-sm">Implement</text>
    <text x="315" y="36" text-anchor="middle" class="text-white text-xs">Agent 2</text>

    <line x1="360" y1="25" x2="390" y2="25" class="stroke-cyan arrow"/>

    <rect x="390" y="5" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="435" y="22" text-anchor="middle" class="text-white text-sm">Test</text>
    <text x="435" y="36" text-anchor="middle" class="text-white text-xs">Agent 3</text>

    <line x1="480" y1="25" x2="510" y2="25" class="stroke-cyan arrow"/>

    <rect x="510" y="5" width="90" height="40" class="node fill-green" stroke="#10B981"/>
    <text x="555" y="22" text-anchor="middle" class="text-white text-sm">Review</text>
    <text x="555" y="36" text-anchor="middle" class="text-white text-xs">Agent 4</text>
  </g>

  <!-- SWARM MODE -->
  <g transform="translate(0, 350)">
    <text x="20" y="50" class="text-white text-md">SWARM</text>

    <rect x="150" y="30" width="100" height="40" class="node fill-purple" stroke="#8B5CF6"/>
    <text x="200" y="47" text-anchor="middle" class="text-white text-sm">Decompose</text>
    <text x="200" y="61" text-anchor="middle" class="text-white text-xs">Plan tasks</text>

    <!-- Workers -->
    <line x1="250" y1="40" x2="310" y2="25" class="stroke-cyan arrow"/>
    <rect x="310" y="5" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="355" y="22" text-anchor="middle" class="text-white text-sm">Worker 1</text>
    <text x="355" y="36" text-anchor="middle" class="text-white text-xs">Task A</text>

    <line x1="250" y1="50" x2="310" y2="50" class="stroke-cyan arrow"/>
    <rect x="310" y="50" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="355" y="67" text-anchor="middle" class="text-white text-sm">Worker 2</text>
    <text x="355" y="81" text-anchor="middle" class="text-white text-xs">Task B</text>

    <line x1="250" y1="60" x2="310" y2="75" class="stroke-cyan arrow"/>
    <rect x="310" y="95" width="90" height="40" class="node fill-cyan" stroke="#06B6D4"/>
    <text x="355" y="112" text-anchor="middle" class="text-white text-sm">Worker 3</text>
    <text x="355" y="126" text-anchor="middle" class="text-white text-xs">Task C</text>

    <!-- Verify -->
    <line x1="400" y1="25" x2="460" y2="50" class="stroke-cyan arrow"/>
    <line x1="400" y1="70" x2="460" y2="50" class="stroke-cyan arrow"/>
    <line x1="400" y1="115" x2="460" y2="50" class="stroke-cyan arrow"/>

    <rect x="460" y="30" width="100" height="40" class="node fill-amber" stroke="#F59E0B"/>
    <text x="510" y="47" text-anchor="middle" class="text-white text-sm">Verify</text>
    <text x="510" y="61" text-anchor="middle" class="text-white text-xs">Auto-check</text>

    <line x1="560" y1="50" x2="620" y2="50" class="stroke-cyan arrow"/>

    <rect x="620" y="30" width="100" height="40" class="node fill-green" stroke="#10B981"/>
    <text x="670" y="47" text-anchor="middle" class="text-white text-sm">Result</text>
    <text x="670" y="61" text-anchor="middle" class="text-white text-xs">Validated</text>
  </g>

  <!-- REVIEW MODE -->
  <g transform="translate(0, 440)">
    <text x="20" y="25" class="text-white text-md">REVIEW</text>

    <rect x="150" y="5" width="100" height="40" class="node fill-amber" stroke="#F59E0B"/>
    <text x="200" y="22" text-anchor="middle" class="text-white text-sm">Opus 4.6</text>
    <text x="200" y="36" text-anchor="middle" class="text-white text-xs">Primary work</text>

    <line x1="250" y1="25" x2="310" y2="25" class="stroke-cyan arrow"/>

    <rect x="310" y="5" width="100" height="40" class="node fill-amber" stroke="#F59E0B"/>
    <text x="360" y="22" text-anchor="middle" class="text-white text-sm">Verifier</text>
    <text x="360" y="36" text-anchor="middle" class="text-white text-xs">Quality check</text>

    <line x1="410" y1="25" x2="470" y2="25" class="stroke-cyan arrow"/>

    <rect x="470" y="5" width="100" height="40" class="node fill-green" stroke="#10B981"/>
    <text x="520" y="22" text-anchor="middle" class="text-white text-sm">Result</text>
    <text x="520" y="36" text-anchor="middle" class="text-white text-xs">Approved</text>
  </g>
</svg>
