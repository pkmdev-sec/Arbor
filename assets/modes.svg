    <text x="30" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">one agent, one task</text>

    <!-- Flow -->
    <!-- Task box -->
    <rect x="180" y="35" width="90" height="38" rx="6" fill="#161b22" stroke="#475569" stroke-width="1.5"/>
    <text x="225" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Task</text>

    <!-- Arrow -->
    <line x1="270" y1="54" x2="310" y2="54" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Agent box -->
    <rect x="310" y="35" width="90" height="38" rx="6" fill="#161b22" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="355" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#06B6D4" text-anchor="middle">Agent</text>

    <!-- Arrow -->
