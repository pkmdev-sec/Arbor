<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450">
  <defs>
    <style>
      .terminal-window { fill: #1E1E2E; stroke: #313244; stroke-width: 2; }
      .title-bar { fill: #181825; }
      .traffic-light { r: 6; cy: 20; }
      .red { fill: #F38BA8; }
      .yellow { fill: #F9E2AF; }
      .green { fill: #A6E3A1; }
      .title-text { fill: #CDD6F4; font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 12px; font-weight: 500; }
      .terminal-text { font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 12px; line-height: 18px; }
      .default { fill: #CDD6F4; }
      .cyan { fill: #89DCEB; font-weight: 600; }
      .green-text { fill: #A6E3A1; }
      .yellow-text { fill: #F9E2AF; }
      .red-text { fill: #F38BA8; }
      .dim { fill: #585B70; }
      .bold { fill: #CDD6F4; font-weight: 700; }
    </style>
  </defs>

  <!-- Window -->
  <rect class="terminal-window" x="0" y="0" width="700" height="450" rx="10" ry="10"/>

  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="700" height="40" rx="10" ry="10"/>
  <rect class="title-bar" x="0" y="30" width="700" height="10"/>

  <!-- Traffic lights -->
  <circle class="traffic-light red" cx="20"/>
  <circle class="traffic-light yellow" cx="40"/>
  <circle class="traffic-light green" cx="60"/>

  <!-- Title -->
  <text class="title-text" x="350" y="25" text-anchor="middle">isolation — rollback in action</text>

  <!-- Terminal content -->
  <g class="terminal-text">
    <text x="20" y="70" class="default">$ swarm --mode single --verify "Edit agent-entry.mjs — add broken code"</text>
    <text x="20" y="90" class="default"></text>

    <text x="20" y="110" class="dim">swarm | mode=single | depth=normal | verify=true</text>
    <text x="20" y="128" class="default"></text>

    <text x="20" y="146" class="dim">isolation: worktree created /tmp/swarm/x7y8z9/worktrees/agent-01</text>
    <text x="20" y="164" class="dim">isolation: snapshot 12026 files, backed up 418</text>
    <text x="20" y="182" class="default"></text>

    <text x="20" y="200" class="cyan">[EXECUTE]</text>
    <text x="98" y="200" class="default"> Single agent...</text>
    <text x="20" y="218" class="green-text">  ✓ agent-01: </text>
    <text x="114" y="218" class="yellow-text">18.2s</text>
    <text x="156" y="218" class="default"> (exit 0)</text>
    <text x="20" y="236" class="default"></text>

    <text x="20" y="254" class="dim">isolation: detected 1 escaped files in mainCwd</text>
    <text x="20" y="272" class="dim">isolation: validating remote-agent/agent-entry.mjs...</text>
    <text x="20" y="290" class="dim">isolation: node --check FAILED: SyntaxError: Unexpected token</text>
    <text x="20" y="308" class="default"></text>

    <text x="20" y="326" class="red-text">  ✗ agent-01: REJECTED — remote-agent/agent-entry.mjs: SyntaxError</text>
    <text x="20" y="344" class="yellow-text">  ↺ Rolled back 1 files from backup</text>
    <text x="20" y="362" class="green-text">  ✓ Original restored — system integrity preserved</text>
    <text x="20" y="380" class="default"></text>

    <text x="20" y="398" class="bold">═══ SWARM COMPLETE ═══</text>
    <text x="20" y="416" class="default">Mode: single | Agents: 1 | Duration: </text>
    <text x="318" y="416" class="yellow-text">22.5s</text>
    <text x="20" y="434" class="default">Completed: 0 | Failed: 1 (changes rejected)</text>
  </g>
</svg>
