<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650">
  <defs>
    <style>
      .terminal-window { fill: #1E1E2E; stroke: #313244; stroke-width: 2; }
      .title-bar { fill: #181825; }
      .traffic-light { r: 6; cy: 20; }
      .red { fill: #F38BA8; }
      .yellow { fill: #F9E2AF; }
      .green { fill: #A6E3A1; }
      .title-text { fill: #CDD6F4; font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 12px; font-weight: 500; }
      .terminal-text { font-family: 'SF Mono', 'Monaco', 'Consolas', monospace; font-size: 12px; line-height: 18px; }
      .default { fill: #CDD6F4; }
      .cyan { fill: #89DCEB; font-weight: 600; }
      .green-text { fill: #A6E3A1; }
      .yellow-text { fill: #F9E2AF; }
      .dim { fill: #585B70; }
      .bold { fill: #CDD6F4; font-weight: 700; }
    </style>
  </defs>

  <!-- Window -->
  <rect class="terminal-window" x="0" y="0" width="700" height="650" rx="10" ry="10"/>

  <!-- Title bar -->
  <rect class="title-bar" x="0" y="0" width="700" height="40" rx="10" ry="10"/>
  <rect class="title-bar" x="0" y="30" width="700" height="10"/>

  <!-- Traffic lights -->
  <circle class="traffic-light red" cx="20"/>
  <circle class="traffic-light yellow" cx="40"/>
  <circle class="traffic-light green" cx="60"/>

  <!-- Title -->
  <text class="title-text" x="350" y="25" text-anchor="middle">swarm — parallel mode</text>

  <!-- Terminal content -->
  <g class="terminal-text">
    <text x="20" y="70" class="default">$ swarm --mode parallel --agents 3 --depth thorough --verify "Explore codebase"</text>
    <text x="20" y="90" class="default"></text>

    <text x="20" y="110" class="dim">swarm | mode=parallel | agents=3 | depth=thorough | verify=true</text>
    <text x="20" y="128" class="dim">Run: /tmp/swarm/a1b2c3d4</text>
    <text x="20" y="146" class="dim">Task: Explore codebase</text>
    <text x="20" y="164" class="default"></text>

    <text x="20" y="182" class="cyan">[DECOMPOSE]</text>
    <text x="108" y="182" class="default"> Scanning project → splitting into 3 subtasks...</text>
    <text x="20" y="200" class="green-text">  ✓ Decomposed into 3 subtasks</text>
    <text x="20" y="218" class="dim">    → Agent 1: Analyze entry points and CLI flow</text>
    <text x="20" y="236" class="dim">    → Agent 2: Map lib/ module dependencies</text>
    <text x="20" y="254" class="dim">    → Agent 3: Review isolation and security model</text>
    <text x="20" y="272" class="default"></text>

    <text x="20" y="290" class="dim">isolation: worktree created /tmp/swarm/a1b2c3d4/worktrees/agent-01</text>
    <text x="20" y="308" class="dim">isolation: worktree created /tmp/swarm/a1b2c3d4/worktrees/agent-02</text>
    <text x="20" y="326" class="dim">isolation: worktree created /tmp/swarm/a1b2c3d4/worktrees/agent-03</text>
    <text x="20" y="344" class="dim">isolation: snapshot 12026 files, backed up 418</text>
    <text x="20" y="362" class="default"></text>

    <text x="20" y="380" class="cyan">[EXECUTE]</text>
    <text x="98" y="380" class="default"> Spawning 3 parallel agents...</text>
    <text x="20" y="398" class="green-text">  ✓ agent-01: </text>
    <text x="114" y="398" class="yellow-text">45.2s</text>
    <text x="156" y="398" class="default"> (exit 0)</text>
    <text x="20" y="416" class="green-text">  ✓ agent-02: </text>
    <text x="114" y="416" class="yellow-text">38.7s</text>
    <text x="156" y="416" class="default"> (exit 0)</text>
    <text x="20" y="434" class="green-text">  ✓ agent-03: </text>
    <text x="114" y="434" class="yellow-text">52.1s</text>
    <text x="156" y="434" class="default"> (exit 0)</text>
    <text x="20" y="452" class="default"></text>

    <text x="20" y="470" class="green-text">  ✓ agent-01: applied 0 files, 0 escaped (validated)</text>
    <text x="20" y="488" class="green-text">  ✓ agent-02: applied 0 files, 0 escaped (validated)</text>
    <text x="20" y="506" class="green-text">  ✓ agent-03: applied 0 files, 0 escaped (validated)</text>
    <text x="20" y="524" class="default"></text>

    <text x="20" y="542" class="cyan">[VERIFY]</text>
    <text x="88" y="542" class="default"> Spawning verifier to cross-check...</text>
    <text x="20" y="560" class="green-text">  ✓ Verification: </text>
    <text x="150" y="560" class="yellow-text">28.3s</text>
    <text x="20" y="578" class="green-text">  VERDICT: PASS</text>
    <text x="20" y="596" class="default"></text>

    <text x="20" y="614" class="bold">═══ SWARM COMPLETE ═══</text>
    <text x="20" y="632" class="default">Mode: parallel | Agents: 4 | Duration: </text>
    <text x="324" y="632" class="yellow-text">89.4s</text>
  </g>
</svg>
