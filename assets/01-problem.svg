<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320">
  <rect width="700" height="320" rx="8" fill="#0d1117"/>
  <text x="350" y="28" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="15" font-weight="700">The Context Death Spiral</text>

  <!-- Before: single bloated session -->
  <text x="170" y="60" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="12" font-weight="600">BEFORE (single session)</text>
  <rect x="30" y="75" width="280" height="30" rx="4" fill="#f85149" opacity="0.2" stroke="#f85149" stroke-width="0.5"/>
  <text x="40" y="95" fill="#f85149" font-family="monospace" font-size="10">Read 40 files ████████████████ 60%</text>
  <rect x="30" y="110" width="280" height="30" rx="4" fill="#d29922" opacity="0.2" stroke="#d29922" stroke-width="0.5"/>
  <text x="40" y="130" fill="#d29922" font-family="monospace" font-size="10">Plan impl   ██████████ 20%</text>
  <rect x="30" y="145" width="280" height="30" rx="4" fill="#8b949e" opacity="0.2" stroke="#8b949e" stroke-width="0.5"/>
  <text x="40" y="165" fill="#8b949e" font-family="monospace" font-size="10">Write code  ████ 10% (barely fits)</text>
  <rect x="30" y="180" width="280" height="30" rx="4" fill="#8b949e" opacity="0.1" stroke="#8b949e" stroke-width="0.5"/>
  <text x="40" y="200" fill="#8b949e" font-family="monospace" font-size="10">Tests       ██ 5% (context dead)</text>
  <rect x="30" y="215" width="280" height="30" rx="4" fill="#f85149" opacity="0.1"/>
  <text x="40" y="235" fill="#f85149" font-family="monospace" font-size="10">Fix errors  X (hallucinating now)</text>
  <text x="170" y="270" text-anchor="middle" fill="#f85149" font-family="system-ui,sans-serif" font-size="11">$421 spent · 3.2M tokens · quality collapsed</text>

  <!-- After: orchestrated -->
  <text x="520" y="60" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="12" font-weight="600">AFTER (remote-agent)</text>
  <rect x="380" y="75" width="280" height="24" rx="4" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="0.5"/>
  <text x="390" y="92" fill="#3fb950" font-family="monospace" font-size="10">Swarm explores  ██ 5% (summary only)</text>
  <rect x="380" y="104" width="280" height="24" rx="4" fill="#7aa2f7" opacity="0.15" stroke="#7aa2f7" stroke-width="0.5"/>
  <text x="390" y="121" fill="#7aa2f7" font-family="monospace" font-size="10">Decide approach ██ 5%</text>
  <rect x="380" y="133" width="280" height="24" rx="4" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="0.5"/>
  <text x="390" y="150" fill="#3fb950" font-family="monospace" font-size="10">Swarm implements ██ 5% (result only)</text>
  <rect x="380" y="162" width="280" height="24" rx="4" fill="#3fb950" opacity="0.15" stroke="#3fb950" stroke-width="0.5"/>
  <text x="390" y="179" fill="#3fb950" font-family="monospace" font-size="10">Swarm tests     ██ 5%</text>
  <rect x="380" y="191" width="280" height="24" rx="4" fill="#bb9af7" opacity="0.15" stroke="#bb9af7" stroke-width="0.5"/>
  <text x="390" y="208" fill="#bb9af7" font-family="monospace" font-size="10">Verifier checks ██ 5%</text>
  <rect x="380" y="220" width="280" height="24" rx="4" fill="#8b949e" opacity="0.1"/>
  <text x="390" y="237" fill="#8b949e" font-family="monospace" font-size="10">                     75% FREE</text>
  <text x="520" y="270" text-anchor="middle" fill="#3fb950" font-family="system-ui,sans-serif" font-size="11">~$15 per task · main session stays lean</text>

  <!-- Arrow -->
  <text x="340" y="165" text-anchor="middle" fill="#7aa2f7" font-family="system-ui,sans-serif" font-size="24">→</text>

  <text x="350" y="305" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="10">Each remote-agent gets its own fresh 1M context — no pollution of the main session</text>
</svg>
