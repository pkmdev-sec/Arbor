<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg-navy { fill: #0F172A; }
      .stroke-cyan { stroke: #06B6D4; stroke-width: 2; fill: none; }
      .fill-cyan { fill: #06B6D4; }
      .fill-amber { fill: #F59E0B; }
      .fill-purple { fill: #8B5CF6; }
      .fill-green { fill: #10B981; }
      .fill-slate { fill: #94A3B8; }
      .text-white { fill: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .text-sm { font-size: 12px; }
      .text-md { font-size: 14px; }
      .text-lg { font-size: 16px; font-weight: 600; }
      .node-box { stroke-width: 2; rx: 8; }
      .arrow { stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#06B6D4" />
    </marker>
    <marker id="arrowhead-amber" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" class="bg-navy"/>

  <!-- Main Claude Session -->
  <rect x="300" y="20" width="300" height="60" class="node-box fill-amber" stroke="#F59E0B"/>
  <text x="450" y="45" text-anchor="middle" class="text-white text-lg">Main Claude Session</text>
  <text x="450" y="63" text-anchor="middle" class="text-white text-sm">User Interaction</text>

  <!-- Arrow to Hooks -->
  <line x1="450" y1="80" x2="450" y2="110" class="stroke-cyan arrow"/>

  <!-- Hooks Layer -->
  <rect x="250" y="110" width="400" height="50" class="node-box fill-slate" stroke="#94A3B8"/>
  <text x="450" y="135" text-anchor="middle" class="text-white text-md">Hook Layer (pre/post-tool execution)</text>
  <text x="450" y="150" text-anchor="middle" class="text-white text-sm">Intercept • Snapshot • Orchestrate</text>

  <!-- Arrow to Orchestrator -->
  <line x1="450" y1="160" x2="450" y2="190" class="stroke-cyan arrow"/>

  <!-- swarm.mjs Orchestrator -->
  <rect x="300" y="190" width="300" height="60" class="node-box fill-purple" stroke="#8B5CF6"/>
  <text x="450" y="212" text-anchor="middle" class="text-white text-lg">swarm.mjs</text>
  <text x="450" y="228" text-anchor="middle" class="text-white text-sm">Orchestrator • Decomposer</text>
  <text x="450" y="242" text-anchor="middle" class="text-white text-sm">Task Assignment • Result Merging</text>

  <!-- Arrows to Agents -->
  <line x1="350" y1="250" x2="150" y2="300" class="stroke-cyan arrow"/>
  <line x1="450" y1="250" x2="450" y2="300" class="stroke-cyan arrow"/>
  <line x1="550" y1="250" x2="750" y2="300" class="stroke-cyan arrow"/>

  <!-- Agent Boxes -->
  <!-- Agent 1 -->
  <rect x="50" y="300" width="200" height="100" class="node-box fill-cyan" stroke="#06B6D4" opacity="0.9"/>
  <text x="150" y="320" text-anchor="middle" class="text-white text-md" font-weight="600">Agent 1</text>
  <text x="150" y="338" text-anchor="middle" class="text-white text-sm">agent-entry.mjs</text>
  <text x="150" y="358" text-anchor="middle" class="text-white text-sm">🧠 Fresh 200K context</text>
  <text x="150" y="375" text-anchor="middle" class="text-white text-sm">⚙️ Isolated config</text>
  <text x="150" y="392" text-anchor="middle" class="text-white text-sm">🛠️ Full tool access</text>

  <!-- Agent 2 -->
  <rect x="350" y="300" width="200" height="100" class="node-box fill-cyan" stroke="#06B6D4" opacity="0.9"/>
  <text x="450" y="320" text-anchor="middle" class="text-white text-md" font-weight="600">Agent 2</text>
  <text x="450" y="338" text-anchor="middle" class="text-white text-sm">agent-entry.mjs</text>
  <text x="450" y="358" text-anchor="middle" class="text-white text-sm">🧠 Fresh 200K context</text>
  <text x="450" y="375" text-anchor="middle" class="text-white text-sm">⚙️ Isolated config</text>
  <text x="450" y="392" text-anchor="middle" class="text-white text-sm">🛠️ Full tool access</text>

  <!-- Agent N -->
  <rect x="650" y="300" width="200" height="100" class="node-box fill-cyan" stroke="#06B6D4" opacity="0.9"/>
  <text x="750" y="320" text-anchor="middle" class="text-white text-md" font-weight="600">Agent N</text>
  <text x="750" y="338" text-anchor="middle" class="text-white text-sm">agent-entry.mjs</text>
  <text x="750" y="358" text-anchor="middle" class="text-white text-sm">🧠 Fresh 200K context</text>
  <text x="750" y="375" text-anchor="middle" class="text-white text-sm">⚙️ Isolated config</text>
  <text x="750" y="392" text-anchor="middle" class="text-white text-sm">🛠️ Full tool access</text>

  <!-- Git Worktree Layer -->
  <rect x="100" y="420" width="700" height="40" class="node-box fill-slate" stroke="#94A3B8" opacity="0.8"/>
  <text x="450" y="445" text-anchor="middle" class="text-white text-md">Git Worktree Isolation Layer</text>

  <!-- Arrows from agents to worktree -->
  <line x1="150" y1="400" x2="150" y2="420" class="stroke-cyan" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="400" x2="450" y2="420" class="stroke-cyan" stroke-width="1" opacity="0.5"/>
  <line x1="750" y1="400" x2="750" y2="420" class="stroke-cyan" stroke-width="1" opacity="0.5"/>

  <!-- Pipeline -->
  <rect x="150" y="480" width="600" height="90" class="node-box" fill="#1E293B" stroke="#475569"/>
  <text x="450" y="500" text-anchor="middle" class="text-white text-lg">Verification Pipeline</text>

  <!-- Pipeline stages -->
  <g transform="translate(200, 515)">
    <rect width="120" height="40" rx="6" class="fill-purple" opacity="0.9"/>
    <text x="60" y="17" text-anchor="middle" class="text-white text-sm" font-weight="600">SNAPSHOT</text>
    <text x="60" y="30" text-anchor="middle" class="text-white text-sm">Git state</text>
  </g>

  <g transform="translate(340, 515)">
    <rect width="120" height="40" rx="6" class="fill-amber" opacity="0.9"/>
    <text x="60" y="17" text-anchor="middle" class="text-white text-sm" font-weight="600">VALIDATE</text>
    <text x="60" y="30" text-anchor="middle" class="text-white text-sm">Check work</text>
  </g>

  <g transform="translate(480, 515)">
    <rect width="120" height="40" rx="6" class="fill-green" opacity="0.9"/>
    <text x="60" y="17" text-anchor="middle" class="text-white text-sm" font-weight="600">APPLY</text>
    <text x="60" y="30" text-anchor="middle" class="text-white text-sm">Merge results</text>
  </g>

  <!-- Pipeline arrows -->
  <line x1="320" y1="535" x2="340" y2="535" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead-amber)"/>
  <line x1="460" y1="535" x2="480" y2="535" stroke="#10B981" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>
