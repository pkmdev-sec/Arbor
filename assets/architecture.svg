<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="960" height="480" fill="#0d0d14" rx="12"/>

  <!-- Arrow marker (uniform gray) -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#4a4a6a"/>
    </marker>
  </defs>

  <!-- ROW 1: Main Session (y=20-110) -->
  <text x="30" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f0f0f5">Main Session</text>
  <text x="30" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">Claude Code · Opus 4.6</text>

  <!-- User Prompt -->
  <rect x="200" y="40" width="110" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="255" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">User Prompt</text>

  <!-- Arrow to Hook Chain -->
  <line x1="315" y1="60" x2="360" y2="60" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hook Chain -->
  <rect x="365" y="40" width="110" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="420" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle">Hook Chain</text>

  <!-- Arrow to Classify -->
  <line x1="480" y1="60" x2="525" y2="60" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Classify -->
  <rect x="530" y="40" width="100" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="580" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8B5CF6" text-anchor="middle">Classify</text>

  <!-- Arrow to Delegate -->
  <line x1="635" y1="60" x2="680" y2="60" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Delegate -->
  <rect x="685" y="40" width="100" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="735" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Delegate</text>

  <!-- Row separator -->
  <line x1="0" y1="115" x2="960" y2="115" stroke="#1a1a2a" stroke-width="1"/>

  <!-- ROW 2: Arbor-Swarm FEATURED ROW (y=120-230) -->
  <!-- Featured row background -->
  <rect x="0" y="120" width="960" height="110" fill="#F59E0B" opacity="0.035"/>

  <text x="30" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f0f0f5">Arbor-Swarm</text>
  <text x="30" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">orchestrator · 5 modes</text>

  <!-- Right metric -->
  <text x="920" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#F59E0B" text-anchor="end" font-weight="bold">5 modes</text>

  <!-- Decompose -->
  <rect x="200" y="145" width="105" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="252.5" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8B5CF6" text-anchor="middle">Decompose</text>

  <!-- Fan-out arrows to 3 agents -->
  <line x1="310" y1="165" x2="360" y2="151" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="165" x2="360" y2="165" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="165" x2="360" y2="179" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 3 stacked Agent boxes (overlapping) -->
  <rect x="365" y="143" width="70" height="28" rx="6" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="400" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle">Agent</text>

  <rect x="365" y="157" width="70" height="28" rx="6" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="400" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle">Agent</text>

  <rect x="365" y="171" width="70" height="28" rx="6" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="400" y="188" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle">Agent</text>

  <!-- Fan-in arrows to Merge -->
  <line x1="440" y1="151" x2="490" y2="165" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="165" x2="490" y2="165" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="179" x2="490" y2="165" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Merge -->
  <rect x="495" y="145" width="85" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="537.5" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Merge</text>

  <!-- Arrow to Verify -->
  <line x1="585" y1="165" x2="630" y2="165" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verify -->
  <rect x="635" y="145" width="85" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="677.5" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle">Verify</text>

  <!-- Row separator -->
  <line x1="0" y1="235" x2="960" y2="235" stroke="#1a1a2a" stroke-width="1"/>

  <!-- ROW 3: Git Worktrees (y=240-340) -->
  <text x="30" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f0f0f5">Git Worktrees</text>
  <text x="30" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">snapshot · validate · apply</text>

  <!-- Right metric -->
  <text x="920" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#10B981" text-anchor="end" font-weight="bold">isolated</text>

  <!-- Snapshot -->
  <rect x="200" y="255" width="95" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="247.5" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Snapshot</text>

  <!-- Arrow to Worktree -->
  <line x1="300" y1="275" x2="340" y2="275" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Worktree -->
  <rect x="345" y="255" width="95" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="392.5" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Worktree</text>

  <!-- Arrow to Execute -->
  <line x1="445" y1="275" x2="485" y2="275" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Execute -->
  <rect x="490" y="255" width="90" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="535" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Execute</text>

  <!-- Arrow to Validate -->
  <line x1="585" y1="275" x2="625" y2="275" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Validate -->
  <rect x="630" y="255" width="90" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="675" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Validate</text>

  <!-- Fork arrows -->
  <line x1="725" y1="275" x2="760" y2="263" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="725" y1="275" x2="760" y2="287" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Apply -->
  <rect x="765" y="248" width="85" height="36" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="807.5" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#10B981" text-anchor="middle">Apply</text>

  <!-- Rollback -->
  <rect x="765" y="288" width="85" height="36" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="807.5" y="310" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#EF4444" text-anchor="middle">Rollback</text>

  <!-- Row separator -->
  <line x1="0" y1="345" x2="960" y2="345" stroke="#1a1a2a" stroke-width="1"/>

  <!-- ROW 4: Output (y=350-440) -->
  <text x="30" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#f0f0f5">Output</text>
  <text x="30" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">IPC · JSONL · TUI</text>

  <!-- Right metric -->
  <text x="920" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#06B6D4" text-anchor="end" font-weight="bold">Fresh 1M Context</text>

  <!-- Collect -->
  <rect x="200" y="365" width="100" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="250" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Collect</text>

  <!-- Arrow to Format -->
  <line x1="305" y1="385" x2="350" y2="385" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Format -->
  <rect x="355" y="365" width="100" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="405" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Format</text>

  <!-- Arrow to Present -->
  <line x1="460" y1="385" x2="505" y2="385" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Present -->
  <rect x="510" y="365" width="100" height="40" rx="8" fill="#252535" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="560" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Present</text>
</svg>