<svg viewBox="0 0 800 510" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="boxAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#3b4563"/>
    </marker>
    <marker id="arrA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#F59E0B"/>
    </marker>
    <marker id="arrC" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#06B6D4"/>
    </marker>
    <marker id="arrE" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="510" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2.5">SYSTEM ARCHITECTURE</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER 1: CLI LAYER (y=44, h=84)               -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="24" y="44" width="752" height="84" rx="12" fill="#0c1222" stroke="#1c2640" stroke-width="0.75" filter="url(#shadow)"/>
  <text x="46" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#F59E0B" letter-spacing="1.5" opacity="0.9">CLI LAYER</text>
  <text x="754" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="end">Claude Code · Opus 4.6</text>

  <!-- 4 boxes × 130w × 36h, gaps=24, total=592, offset=(752-592)/2=80, start x=104 -->
  <!-- User Prompt -->
  <rect x="104" y="72" width="130" height="36" rx="8" fill="#151c30" stroke="#242e4c" stroke-width="0.5"/>
  <text x="169" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="500">User Prompt</text>
  <line x1="236" y1="90" x2="256" y2="90" stroke="#3b4563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Hook Chain -->
  <rect x="260" y="72" width="130" height="36" rx="8" fill="#151c30" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.35"/>
  <rect x="260" y="72" width="130" height="36" rx="8" fill="url(#boxAmber)"/>
  <text x="325" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="500">Hook Chain</text>
  <line x1="392" y1="90" x2="412" y2="90" stroke="#3b4563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Classify -->
  <rect x="416" y="72" width="130" height="36" rx="8" fill="#151c30" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.35"/>
  <rect x="416" y="72" width="130" height="36" rx="8" fill="url(#boxViolet)"/>
  <text x="481" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8B5CF6" text-anchor="middle" font-weight="500">Classify</text>
  <line x1="548" y1="90" x2="568" y2="90" stroke="#3b4563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Delegate -->
  <rect x="572" y="72" width="130" height="36" rx="8" fill="#151c30" stroke="#242e4c" stroke-width="0.5"/>
  <text x="637" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="500">Delegate</text>

  <!-- Down arrow: CLI → Orchestrator -->
  <line x1="400" y1="130" x2="400" y2="150" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrA)" opacity="0.6"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER 2: ORCHESTRATOR (y=156, h=84)            -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="24" y="156" width="752" height="84" rx="12" fill="#0c1222" stroke="#1c2640" stroke-width="0.75" filter="url(#shadow)"/>
  <rect x="24" y="156" width="752" height="84" rx="12" fill="#F59E0B" opacity="0.015" rx="12"/>
  <text x="46" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#8B5CF6" letter-spacing="1.5" opacity="0.9">ORCHESTRATOR</text>
  <text x="754" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="end">swarm.mjs · 5 modes</text>

  <!-- 3 boxes × 140w × 36h, gaps=28, total=476, offset=(752-476)/2=138, start x=162 -->
  <!-- Auto Mode -->
  <rect x="162" y="184" width="140" height="36" rx="8" fill="#151c30" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.35"/>
  <rect x="162" y="184" width="140" height="36" rx="8" fill="url(#boxViolet)"/>
  <text x="232" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8B5CF6" text-anchor="middle" font-weight="500">Auto Mode</text>
  <line x1="304" y1="202" x2="328" y2="202" stroke="#3b4563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Decompose -->
  <rect x="332" y="184" width="140" height="36" rx="8" fill="#151c30" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.35"/>
  <rect x="332" y="184" width="140" height="36" rx="8" fill="url(#boxAmber)"/>
  <text x="402" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#F59E0B" text-anchor="middle" font-weight="500">Decompose</text>
  <line x1="474" y1="202" x2="498" y2="202" stroke="#3b4563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Coordinate -->
  <rect x="502" y="184" width="140" height="36" rx="8" fill="#151c30" stroke="#242e4c" stroke-width="0.5"/>
  <text x="572" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="500">Coordinate</text>

  <!-- Fan-out arrows: Orchestrator → Agents -->
  <line x1="310" y1="242" x2="174" y2="278" stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrC)" opacity="0.5"/>
  <line x1="400" y1="242" x2="400" y2="278" stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrC)" opacity="0.5"/>
  <line x1="490" y1="242" x2="626" y2="278" stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrC)" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER 3: AGENT WORKERS (y=284, h=106)          -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="24" y="284" width="752" height="106" rx="12" fill="#0c1222" stroke="#1c2640" stroke-width="0.75" filter="url(#shadow)"/>
  <text x="46" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#06B6D4" letter-spacing="1.5" opacity="0.9">AGENT WORKERS</text>
  <text x="754" y="302" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="end">isolated · fresh 1M context</text>

  <!-- 3 agent cards × 196w × 62h, gaps=28, total=644, offset=(752-644)/2=54, start x=78 -->
  <!-- Agent 1 -->
  <rect x="78" y="312" width="196" height="62" rx="10" fill="#151c30" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.25"/>
  <rect x="78" y="312" width="196" height="62" rx="10" fill="url(#boxCyan)"/>
  <text x="176" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle" font-weight="600">Agent 1</text>
  <text x="176" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">worktree · fresh ctx</text>
  <text x="176" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">no hooks · isolated</text>

  <!-- Agent 2 -->
  <rect x="302" y="312" width="196" height="62" rx="10" fill="#151c30" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.25"/>
  <rect x="302" y="312" width="196" height="62" rx="10" fill="url(#boxCyan)"/>
  <text x="400" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle" font-weight="600">Agent 2</text>
  <text x="400" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">worktree · fresh ctx</text>
  <text x="400" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">no hooks · isolated</text>

  <!-- Agent 3 -->
  <rect x="526" y="312" width="196" height="62" rx="10" fill="#151c30" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.25"/>
  <rect x="526" y="312" width="196" height="62" rx="10" fill="url(#boxCyan)"/>
  <text x="624" y="334" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle" font-weight="600">Agent 3</text>
  <text x="624" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">worktree · fresh ctx</text>
  <text x="624" y="364" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="middle">no hooks · isolated</text>

  <!-- Fan-in arrows: Agents → Merge -->
  <line x1="176" y1="376" x2="310" y2="410" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrE)" opacity="0.5"/>
  <line x1="400" y1="376" x2="400" y2="410" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrE)" opacity="0.5"/>
  <line x1="624" y1="376" x2="490" y2="410" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrE)" opacity="0.5"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- LAYER 4: MERGE & OUTPUT (y=416, h=78)          -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="24" y="416" width="752" height="78" rx="12" fill="#0c1222" stroke="#1c2640" stroke-width="0.75" filter="url(#shadow)"/>
  <text x="46" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#10B981" letter-spacing="1.5" opacity="0.9">MERGE &amp; OUTPUT</text>
  <text x="754" y="434" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569" text-anchor="end">verify · apply · present</text>

  <!-- 3 boxes × 140w × 36h, gaps=28, total=476, same as orchestrator -->
  <!-- Collect -->
  <rect x="162" y="444" width="140" height="36" rx="8" fill="#151c30" stroke="#242e4c" stroke-width="0.5"/>
  <text x="232" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="500">Collect</text>
  <line x1="304" y1="462" x2="328" y2="462" stroke="#3b4563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Verify -->
  <rect x="332" y="444" width="140" height="36" rx="8" fill="#151c30" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.35"/>
  <rect x="332" y="444" width="140" height="36" rx="8" fill="url(#boxEmerald)"/>
  <text x="402" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#10B981" text-anchor="middle" font-weight="500">Verify</text>
  <line x1="474" y1="462" x2="498" y2="462" stroke="#3b4563" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="502" y="444" width="140" height="36" rx="8" fill="#151c30" stroke="#242e4c" stroke-width="0.5"/>
  <text x="572" y="466" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle" font-weight="500">Output</text>
</svg>