<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="960" height="520" fill="#0D1117" rx="12"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#475569"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#8B5CF6"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#06B6D4"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#10B981"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#EF4444"/>
    </marker>
  </defs>

  <!-- ROW 1 - User Session -->
  <text x="30" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#E2E8F0">Main Session</text>
  <text x="30" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">Claude Code · Opus 4.6</text>

  <!-- User Prompt -->
  <rect x="200" y="50" width="120" height="44" rx="8" fill="#161b22" stroke="#475569" stroke-width="1"/>
  <text x="260" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">User Prompt</text>

  <!-- Arrow to Hook Chain -->
  <line x1="325" y1="72" x2="365" y2="72" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Hook Chain -->
  <rect x="370" y="50" width="120" height="44" rx="8" fill="#161b22" stroke="#F59E0B" stroke-width="1"/>
  <text x="430" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle">Hook Chain</text>

  <!-- Arrow to Classify -->
  <line x1="495" y1="72" x2="535" y2="72" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Classify -->
  <rect x="540" y="50" width="100" height="44" rx="8" fill="#161b22" stroke="#8B5CF6" stroke-width="1"/>
  <text x="590" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8B5CF6" text-anchor="middle">Classify</text>

  <!-- Arrow to Delegate -->
  <line x1="645" y1="72" x2="685" y2="72" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Delegate -->
  <rect x="690" y="50" width="100" height="44" rx="8" fill="#161b22" stroke="#F59E0B" stroke-width="1"/>
  <text x="740" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle">Delegate</text>

  <!-- Separator -->
  <line x1="0" y1="115" x2="960" y2="115" stroke="#1e293b" stroke-width="1"/>

  <!-- ROW 2 - Orchestration -->
  <text x="30" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#06B6D4">Arbor-Swarm</text>
  <text x="30" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">orchestrator · 5 modes</text>

  <!-- Decompose -->
  <rect x="200" y="150" width="100" height="44" rx="8" fill="#161b22" stroke="#8B5CF6" stroke-width="1"/>
  <text x="250" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8B5CF6" text-anchor="middle">Decompose</text>

  <!-- Fan-out arrows -->
  <line x1="305" y1="172" x2="365" y2="158" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="305" y1="172" x2="365" y2="172" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="305" y1="172" x2="365" y2="186" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- 3 Agent boxes -->
  <rect x="370" y="148" width="80" height="34" rx="6" fill="#161b22" stroke="#06B6D4" stroke-width="1"/>
  <text x="410" y="169" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle">Agent</text>

  <rect x="370" y="168" width="80" height="34" rx="6" fill="#161b22" stroke="#06B6D4" stroke-width="1"/>
  <text x="410" y="189" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle">Agent</text>

  <rect x="370" y="188" width="80" height="34" rx="6" fill="#161b22" stroke="#06B6D4" stroke-width="1"/>
  <text x="410" y="209" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle">Agent</text>

  <!-- Fan-in arrows -->
  <line x1="455" y1="158" x2="515" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="455" y1="172" x2="515" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <line x1="455" y1="186" x2="515" y2="172" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Merge -->
  <rect x="520" y="150" width="80" height="44" rx="8" fill="#161b22" stroke="#475569" stroke-width="1"/>
  <text x="560" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Merge</text>

  <!-- Arrow to Verify -->
  <line x1="605" y1="172" x2="645" y2="172" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Verify -->
  <rect x="650" y="150" width="80" height="44" rx="8" fill="#161b22" stroke="#F59E0B" stroke-width="1"/>
  <text x="690" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle">Verify</text>

  <!-- Separator -->
  <line x1="0" y1="235" x2="960" y2="235" stroke="#1e293b" stroke-width="1"/>

  <!-- ROW 3 - Isolation Layer -->
  <text x="30" y="268" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#10B981">Git Worktrees</text>
  <text x="30" y="282" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">snapshot · validate · apply</text>

  <!-- Snapshot -->
  <rect x="200" y="260" width="100" height="44" rx="8" fill="#161b22" stroke="#06B6D4" stroke-width="1"/>
  <text x="250" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#06B6D4" text-anchor="middle">Snapshot</text>

  <!-- Arrow to Worktree -->
  <line x1="305" y1="282" x2="345" y2="282" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Worktree -->
  <rect x="350" y="260" width="100" height="44" rx="8" fill="#161b22" stroke="#10B981" stroke-width="1"/>
  <text x="400" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#10B981" text-anchor="middle">Worktree</text>

  <!-- Arrow to Execute -->
  <line x1="455" y1="282" x2="495" y2="282" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Execute -->
  <rect x="500" y="260" width="90" height="44" rx="8" fill="#161b22" stroke="#06B6D4" stroke-width="1"/>
  <text x="545" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#06B6D4" text-anchor="middle">Execute</text>

  <!-- Arrow to Validate -->
  <line x1="595" y1="282" x2="635" y2="282" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Validate -->
  <rect x="640" y="260" width="90" height="44" rx="8" fill="#161b22" stroke="#10B981" stroke-width="1"/>
  <text x="685" y="286" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#10B981" text-anchor="middle">Validate</text>

  <!-- Fork arrows -->
  <line x1="735" y1="282" x2="765" y2="270" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="735" y1="282" x2="765" y2="294" stroke="#EF4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Apply (success path) -->
  <rect x="770" y="250" width="80" height="36" rx="8" fill="#10B981" stroke="#10B981" stroke-width="1"/>
  <text x="810" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0D1117" text-anchor="middle" font-weight="bold">Apply ✓</text>

  <!-- Rollback (failure path) -->
  <rect x="770" y="290" width="80" height="36" rx="8" fill="#161b22" stroke="#EF4444" stroke-width="1"/>
  <text x="810" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#EF4444" text-anchor="middle">Rollback</text>

  <!-- Separator -->
  <line x1="0" y1="345" x2="960" y2="345" stroke="#1e293b" stroke-width="1"/>

  <!-- ROW 4 - Result -->
  <text x="30" y="378" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#E2E8F0">Output</text>
  <text x="30" y="392" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748B">IPC · JSONL · TUI</text>

  <!-- Collect -->
  <rect x="200" y="370" width="90" height="44" rx="8" fill="#161b22" stroke="#475569" stroke-width="1"/>
  <text x="245" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Collect</text>

  <!-- Arrow to Format -->
  <line x1="295" y1="392" x2="335" y2="392" stroke="#475569" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Format -->
  <rect x="340" y="370" width="90" height="44" rx="8" fill="#161b22" stroke="#475569" stroke-width="1"/>
  <text x="385" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#E2E8F0" text-anchor="middle">Format</text>

  <!-- Arrow to Present -->
  <line x1="435" y1="392" x2="475" y2="392" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Present -->
  <rect x="480" y="370" width="90" height="44" rx="8" fill="#10B981" stroke="#10B981" stroke-width="1"/>
  <text x="525" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#0D1117" text-anchor="middle" font-weight="bold">Present</text>

  <!-- Context metric -->
  <text x="900" y="396" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#06B6D4" text-anchor="end" font-weight="bold">Fresh 1M Context</text>
</svg>
