<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#06B6D4"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#000000"/>

  <!-- Row 1: Main Claude Session (y=30) -->
  <rect x="300" y="30" width="200" height="60" rx="8" ry="8" fill="#111111" stroke="#F59E0B" stroke-width="2"/>
  <text x="400" y="56" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#E2E8F0">Main Claude Session</text>
  <text x="400" y="74" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">Opus 4.6 · 1M context · hooks active</text>

  <!-- Row 2: Hooks bar (y=130) -->
  <rect x="150" y="130" width="500" height="36" rx="8" ry="8" fill="#111111" stroke="#333333" stroke-width="1.5"/>
  <text x="400" y="153" text-anchor="middle" font-family="monospace" font-size="11" fill="#64748B">auto_orchestrator → block_agent_tool → fulfill_delegate</text>

  <!-- Row 3: Swarm node (y=220) -->
  <rect x="310" y="220" width="180" height="56" rx="8" ry="8" fill="#111111" stroke="#06B6D4" stroke-width="2"/>
  <text x="400" y="247" text-anchor="middle" font-family="monospace" font-size="14" fill="#06B6D4">swarm.mjs</text>
  <text x="400" y="263" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">orchestrator · 5 modes</text>

  <!-- Row 4: Agent 1 (x=120) -->
  <rect x="40" y="330" width="160" height="70" rx="8" ry="8" fill="#111111" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="120" y="355" text-anchor="middle" font-family="monospace" font-size="12" fill="#E2E8F0">agent-entry.mjs</text>
  <text x="120" y="372" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">Fresh 1M context</text>
  <text x="120" y="387" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">Isolated · No hooks</text>

  <!-- Row 4: Agent 2 (x=340) -->
  <rect x="260" y="330" width="160" height="70" rx="8" ry="8" fill="#111111" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="340" y="355" text-anchor="middle" font-family="monospace" font-size="12" fill="#E2E8F0">agent-entry.mjs</text>
  <text x="340" y="372" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">Fresh 1M context</text>
  <text x="340" y="387" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">Isolated · No hooks</text>

  <!-- Row 4: Agent 3 (x=560) -->
  <rect x="480" y="330" width="160" height="70" rx="8" ry="8" fill="#111111" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="560" y="355" text-anchor="middle" font-family="monospace" font-size="12" fill="#E2E8F0">agent-entry.mjs</text>
  <text x="560" y="372" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">Fresh 1M context</text>
  <text x="560" y="387" text-anchor="middle" font-family="monospace" font-size="10" fill="#64748B">Isolated · No hooks</text>

  <!-- Row 5: Worktree 1 -->
  <rect x="60" y="440" width="120" height="40" rx="8" ry="8" fill="#111111" stroke="#10B981" stroke-width="1.5"/>
  <text x="120" y="458" text-anchor="middle" font-family="monospace" font-size="11" fill="#10B981">worktree</text>
  <text x="120" y="472" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">snapshot · validate</text>

  <!-- Row 5: Worktree 2 -->
  <rect x="280" y="440" width="120" height="40" rx="8" ry="8" fill="#111111" stroke="#10B981" stroke-width="1.5"/>
  <text x="340" y="458" text-anchor="middle" font-family="monospace" font-size="11" fill="#10B981">worktree</text>
  <text x="340" y="472" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">snapshot · validate</text>

  <!-- Row 5: Worktree 3 -->
  <rect x="500" y="440" width="120" height="40" rx="8" ry="8" fill="#111111" stroke="#10B981" stroke-width="1.5"/>
  <text x="560" y="458" text-anchor="middle" font-family="monospace" font-size="11" fill="#10B981">worktree</text>
  <text x="560" y="472" text-anchor="middle" font-family="monospace" font-size="9" fill="#64748B">snapshot · validate</text>

  <!-- Connection: Main → Hooks (amber arrow) -->
  <line x1="400" y1="90" x2="400" y2="128" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- Connection: Hooks → Swarm (cyan arrow) -->
  <line x1="400" y1="166" x2="400" y2="218" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Connection: Swarm → Agent 1 (cyan, fan left) -->
  <line x1="355" y1="276" x2="120" y2="328" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Connection: Swarm → Agent 2 (cyan, straight down) -->
  <line x1="400" y1="276" x2="340" y2="328" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Connection: Swarm → Agent 3 (cyan, fan right) -->
  <line x1="445" y1="276" x2="560" y2="328" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- Connection: Agent 1 → Worktree 1 (dashed green) -->
  <line x1="120" y1="400" x2="120" y2="438" stroke="#10B981" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>

  <!-- Connection: Agent 2 → Worktree 2 (dashed green) -->
  <line x1="340" y1="400" x2="340" y2="438" stroke="#10B981" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>

  <!-- Connection: Agent 3 → Worktree 3 (dashed green) -->
  <line x1="560" y1="400" x2="560" y2="438" stroke="#10B981" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
</svg>
