<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7aa2f7"/>
    </marker>
  </defs>
  <rect width="820" height="500" rx="8" fill="#1a1b26"/>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" fill="#c0caf5" font-family="sans-serif" font-size="16" font-weight="bold">How remote-agent Works</text>

  <!-- Main Session Box -->
  <rect x="270" y="50" width="280" height="50" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
  <text x="410" y="80" text-anchor="middle" fill="#7aa2f7" font-family="sans-serif" font-size="14" font-weight="bold">Main Claude Session</text>
  <text x="410" y="94" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="10">stays at 20-30% context</text>

  <!-- Arrow down -->
  <line x1="410" y1="100" x2="410" y2="130" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="120" fill="#565f89" font-family="sans-serif" font-size="10">user prompt</text>

  <!-- Orchestrator Box -->
  <rect x="290" y="135" width="240" height="45" rx="6" fill="#24283b" stroke="#e0af68" stroke-width="2"/>
  <text x="410" y="155" text-anchor="middle" fill="#e0af68" font-family="sans-serif" font-size="12" font-weight="bold">AI Orchestrator (Haiku)</text>
  <text x="410" y="170" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="10">classifies → routes → enforces</text>

  <!-- Arrow down -->
  <line x1="410" y1="180" x2="410" y2="210" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Swarm Box -->
  <rect x="300" y="215" width="220" height="45" rx="6" fill="#24283b" stroke="#bb9af7" stroke-width="2"/>
  <text x="410" y="235" text-anchor="middle" fill="#bb9af7" font-family="sans-serif" font-size="12" font-weight="bold">Swarm Controller</text>
  <text x="410" y="250" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="10">decompose → parallel → verify</text>

  <!-- Arrows to agents -->
  <line x1="340" y1="260" x2="130" y2="300" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="260" x2="330" y2="300" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="260" x2="490" y2="300" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="260" x2="680" y2="300" stroke="#7aa2f7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Agent boxes -->
  <rect x="50" y="305" width="160" height="55" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="130" y="325" text-anchor="middle" fill="#9ece6a" font-family="sans-serif" font-size="11" font-weight="bold">Agent 01</text>
  <text x="130" y="340" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">src/models/</text>
  <text x="130" y="352" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">fresh 1M context</text>

  <rect x="250" y="305" width="160" height="55" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="330" y="325" text-anchor="middle" fill="#9ece6a" font-family="sans-serif" font-size="11" font-weight="bold">Agent 02</text>
  <text x="330" y="340" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">src/services/</text>
  <text x="330" y="352" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">fresh 1M context</text>

  <rect x="420" y="305" width="160" height="55" rx="6" fill="#24283b" stroke="#9ece6a" stroke-width="1.5"/>
  <text x="500" y="325" text-anchor="middle" fill="#9ece6a" font-family="sans-serif" font-size="11" font-weight="bold">Agent 03</text>
  <text x="500" y="340" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">src/components/</text>
  <text x="500" y="352" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">fresh 1M context</text>

  <rect x="610" y="305" width="160" height="55" rx="6" fill="#24283b" stroke="#f7768e" stroke-width="1.5"/>
  <text x="690" y="325" text-anchor="middle" fill="#f7768e" font-family="sans-serif" font-size="11" font-weight="bold">Verifier</text>
  <text x="690" y="340" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">opus — cross-checks</text>
  <text x="690" y="352" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="9">claims vs git diff</text>

  <!-- Arrows to result -->
  <line x1="130" y1="360" x2="360" y2="400" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="360" x2="380" y2="400" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="360" x2="430" y2="400" stroke="#9ece6a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="690" y1="360" x2="460" y2="400" stroke="#f7768e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Result box -->
  <rect x="310" y="405" width="200" height="45" rx="6" fill="#24283b" stroke="#7aa2f7" stroke-width="2"/>
  <text x="410" y="425" text-anchor="middle" fill="#7aa2f7" font-family="sans-serif" font-size="12" font-weight="bold">Completion Contract</text>
  <text x="410" y="440" text-anchor="middle" fill="#565f89" font-family="sans-serif" font-size="10">merged results + verdict</text>

  <!-- Arrow back up -->
  <line x1="410" y1="450" x2="410" y2="478" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="410" y="493" text-anchor="middle" fill="#c0caf5" font-family="sans-serif" font-size="11">→ Main session reads summary (2KB, not 200KB)</text>
</svg>
