<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Arbor Small — Organic Tree</title>
  <defs>
    <!-- Container gradients -->
    <linearGradient id="bgSm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <radialGradient id="vigSm" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Trunk gradient -->
    <linearGradient id="tSm" x1="32" y1="50" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D2312"/>
      <stop offset="50%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#7A5020"/>
    </linearGradient>

    <!-- Branch gradients (bark to vivid color) -->
    <linearGradient id="bAmb" x1="24" y1="32" x2="16" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
    <linearGradient id="bGrn" x1="28" y1="32" x2="24" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#2EAB6F"/>
    </linearGradient>
    <linearGradient id="bCyn" x1="32" y1="32" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#1AAFCA"/>
    </linearGradient>
    <linearGradient id="bVio" x1="36" y1="32" x2="40" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#8B6FC0"/>
    </linearGradient>
    <linearGradient id="bCor" x1="40" y1="32" x2="48" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3818"/>
      <stop offset="100%" stop-color="#E8732A"/>
    </linearGradient>
  </defs>

  <!-- Container squircle -->
  <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#bgSm)"/>
  <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#vigSm)"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="10.5" fill="none" stroke="#fff" stroke-opacity="0.06" stroke-width="0.5"/>

  <!-- Organic trunk (tapered, filled path) -->
  <path d="
    M 30,50
    C 30,47 30,44 30.5,40
    C 31,36 31,32 31,32
    L 33,32
    C 33,32 33,36 33.5,40
    C 34,44 34,47 34,50
    Z
  " fill="url(#tSm)"/>

  <!-- Trunk highlight (left edge) -->
  <path d="
    M 30,50 C 30,47 30,44 30.5,40 C 31,36 31,32 31,32
    L 30.7,32 C 30.7,32 30.7,36 30.3,40 C 29.9,44 30,47 30,50 Z
  " fill="#fff" opacity="0.08"/>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="50.5" rx="3" ry="0.7" fill="#000" opacity="0.15"/>

  <!-- Fork junction -->
  <ellipse cx="32" cy="33" rx="2.5" ry="1.5" fill="#6B4423"/>
  <ellipse cx="31.5" cy="32.5" rx="1.2" ry="0.8" fill="#fff" opacity="0.05"/>

  <!-- Organic branches (tapered, filled paths, back to front) -->

  <!-- Amber branch (far left) -->
  <path d="
    M 30.5,32.5
    C 27,28 23,24 16,20
    L 15.5,20.5
    C 22,24 26,28 29.5,32.5
    Z
  " fill="url(#bAmb)"/>

  <!-- Coral branch (far right) -->
  <path d="
    M 33.5,32.5
    C 37,28 41,24 48,20
    L 48.5,20.5
    C 42,24 38,28 34.5,32.5
    Z
  " fill="url(#bCor)"/>

  <!-- Green branch (mid left) -->
  <path d="
    M 30,32
    C 29,28 27,24 24,18
    L 24.5,18.5
    C 27,24 29,28 30.5,32
    Z
  " fill="url(#bGrn)"/>

  <!-- Violet branch (mid right) -->
  <path d="
    M 34,32
    C 35,28 37,24 40,18
    L 39.5,18.5
    C 37,24 35,28 33.5,32
    Z
  " fill="url(#bVio)"/>

  <!-- Cyan branch (center, frontmost) -->
  <path d="
    M 31.5,32
    C 31.5,28 32,24 32,16
    L 32.5,16
    C 32.5,24 32.5,28 32.5,32
    Z
  " fill="url(#bCyn)"/>

  <!-- Foliage clusters (simplified circles at tips) -->

  <!-- Amber cluster -->
  <circle cx="16" cy="20" r="2.8" fill="#FFD700" opacity="0.3"/>
  <circle cx="15.2" cy="19.2" r="1.2" fill="#FFE44D" opacity="0.85"/>
  <circle cx="16.8" cy="19" r="1" fill="#FFD700" opacity="0.8"/>
  <circle cx="16" cy="21" r="0.9" fill="#FFC107" opacity="0.75"/>

  <!-- Green cluster -->
  <circle cx="24" cy="18" r="2.8" fill="#34D399" opacity="0.3"/>
  <circle cx="23.2" cy="17.2" r="1.2" fill="#5DEAAD" opacity="0.85"/>
  <circle cx="24.8" cy="17" r="1" fill="#34D399" opacity="0.8"/>
  <circle cx="24" cy="19" r="0.9" fill="#2CC98E" opacity="0.75"/>

  <!-- Cyan cluster (center, slightly larger) -->
  <circle cx="32" cy="16" r="3.2" fill="#22D3EE" opacity="0.35"/>
  <circle cx="31.2" cy="15" r="1.4" fill="#5CE0F0" opacity="0.85"/>
  <circle cx="32.8" cy="15" r="1.1" fill="#22D3EE" opacity="0.85"/>
  <circle cx="32" cy="17.2" r="1" fill="#1DC5DE" opacity="0.8"/>

  <!-- Violet cluster -->
  <circle cx="40" cy="18" r="2.8" fill="#A78BFA" opacity="0.3"/>
  <circle cx="39.2" cy="17.2" r="1.2" fill="#C4A8FF" opacity="0.85"/>
  <circle cx="40.8" cy="17" r="1" fill="#A78BFA" opacity="0.8"/>
  <circle cx="40" cy="19" r="0.9" fill="#9B7EF0" opacity="0.75"/>

  <!-- Coral cluster -->
  <circle cx="48" cy="20" r="2.8" fill="#FB923C" opacity="0.3"/>
  <circle cx="47.2" cy="19.2" r="1.2" fill="#FCA75C" opacity="0.85"/>
  <circle cx="48.8" cy="19" r="1" fill="#FB923C" opacity="0.8"/>
  <circle cx="48" cy="21" r="0.9" fill="#F08030" opacity="0.75"/>
</svg>
