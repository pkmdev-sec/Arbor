<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Arbor Small</title>
  <defs>
    <linearGradient id="bgSm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="tSm" x1="32" y1="48" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D2312"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <!-- Node glass gradients -->
    <radialGradient id="s1" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#D4A017"/>
    </radialGradient>
    <radialGradient id="s2" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#059669"/>
    </radialGradient>
    <radialGradient id="s3" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#0891B2"/>
    </radialGradient>
    <radialGradient id="s4" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#DB2777"/>
    </radialGradient>
    <radialGradient id="s5" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
  </defs>

  <!-- Container -->
  <rect x="6" y="6" width="52" height="52" rx="11" fill="url(#bgSm)"/>
  <rect x="6.5" y="6.5" width="51" height="51" rx="10.5" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="0.5"/>

  <!-- Trunk -->
  <line x1="32" y1="48" x2="32" y2="34" stroke="url(#tSm)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Branches (5 colored) -->
  <path d="M 32,34 Q 22,28 14,18" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 32,34 Q 26,26 21,15" stroke="#34D399" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <line x1="32" y1="34" x2="32" y2="12" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 32,34 Q 38,26 43,15" stroke="#F472B6" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M 32,34 Q 42,28 50,18" stroke="#FB923C" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Fork junction -->
  <circle cx="32" cy="34" r="2.5" fill="#FCD34D"/>
  <circle cx="31.3" cy="33.3" r="0.8" fill="#fff" opacity="0.6"/>

  <!-- Glass sphere nodes -->
  <circle cx="14" cy="18" r="3.5" fill="url(#s1)"/>
  <circle cx="13" cy="17" r="1.2" fill="#fff" opacity="0.6"/>

  <circle cx="21" cy="15" r="3.5" fill="url(#s2)"/>
  <circle cx="20" cy="14" r="1.2" fill="#fff" opacity="0.6"/>

  <circle cx="32" cy="12" r="4" fill="url(#s3)"/>
  <circle cx="31" cy="11" r="1.3" fill="#fff" opacity="0.6"/>

  <circle cx="43" cy="15" r="3.5" fill="url(#s4)"/>
  <circle cx="42" cy="14" r="1.2" fill="#fff" opacity="0.6"/>

  <circle cx="50" cy="18" r="3.5" fill="url(#s5)"/>
  <circle cx="49" cy="17" r="1.2" fill="#fff" opacity="0.6"/>
</svg>
