<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Pitch black background -->
  <rect width="64" height="64" fill="#000000"/>
  <circle cx="32" cy="32" r="31" fill="#000000"/>

  <!-- Central amber hexagon -->
  <polygon points="32,22 40.7,27 40.7,37 32,42 23.3,37 23.3,27" fill="#F59E0B"/>

  <!-- Three cyan agent dots (120 degrees apart) -->
  <circle cx="32" cy="11" r="4" fill="#06B6D4"/>
  <circle cx="50" cy="42" r="4" fill="#06B6D4"/>
  <circle cx="14" cy="42" r="4" fill="#06B6D4"/>

  <!-- Thin connecting lines -->
  <line x1="32" y1="22" x2="32" y2="15" stroke="#06B6D4" stroke-width="0.8" opacity="0.4"/>
  <line x1="40.7" y1="37" x2="46" y2="42" stroke="#06B6D4" stroke-width="0.8" opacity="0.4"/>
  <line x1="23.3" y1="37" x2="18" y2="42" stroke="#06B6D4" stroke-width="0.8" opacity="0.4"/>
</svg>
