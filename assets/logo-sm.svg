<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#1a1f35;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1"/>

  <!-- Root hint -->
  <line x1="32" y1="48" x2="32" y2="54" stroke="#1e293b" stroke-width="1.5" opacity="0.5"/>

  <!-- Trunk (amber facets) -->
  <polygon points="30,48 32,42 34,48" fill="#B45309"/>
  <polygon points="28,42 32,42 30,48" fill="#D97706"/>
  <polygon points="32,42 36,42 34,48" fill="#D97706"/>
  <polygon points="30,36 32,42 28,42" fill="#F59E0B"/>
  <polygon points="32,42 34,36 36,42" fill="#F59E0B"/>
  <polygon points="32,24 30,36 34,36" fill="#D97706"/>

  <!-- Branch 1: Left-low -->
  <polygon points="30,36 22,38 28,34" fill="#0891B2"/>
  <polygon points="22,38 20,40 28,34" fill="#0E7490"/>

  <!-- Branch 2: Left-mid -->
  <polygon points="30,30 24,28 28,32" fill="#06B6D4"/>
  <polygon points="24,28 22,26 28,32" fill="#0891B2"/>

  <!-- Branch 3: Left-high -->
  <polygon points="31,26 26,22 30,28" fill="#06B6D4"/>
  <polygon points="26,22 24,20 30,28" fill="#0891B2"/>

  <!-- Branch 4: Right-low -->
  <polygon points="34,36 42,38 36,34" fill="#0891B2"/>
  <polygon points="42,38 44,40 36,34" fill="#0E7490"/>

  <!-- Branch 5: Right-mid -->
  <polygon points="34,30 40,28 36,32" fill="#06B6D4"/>
  <polygon points="40,28 42,26 36,32" fill="#0891B2"/>

  <!-- Branch 6: Right-high -->
  <polygon points="33,26 38,22 34,28" fill="#06B6D4"/>
  <polygon points="38,22 40,20 34,28" fill="#0891B2"/>

  <!-- Canopy clusters (emerald) -->
  <!-- Left-low cluster -->
  <polygon points="20,40 18,42 22,42" fill="#10B981"/>
  <polygon points="18,42 20,44 22,42" fill="#059669"/>

  <!-- Left-mid cluster -->
  <polygon points="22,26 20,24 24,24" fill="#10B981"/>
  <polygon points="20,24 22,22 24,24" fill="#059669"/>
  <polygon points="22,22 20,20 24,22" fill="#10B981"/>

  <!-- Left-high cluster -->
  <polygon points="24,20 22,18 26,18" fill="#10B981"/>
  <polygon points="22,18 24,16 26,18" fill="#059669"/>

  <!-- Right-low cluster -->
  <polygon points="44,40 42,42 46,42" fill="#10B981"/>
  <polygon points="42,42 44,44 46,42" fill="#059669"/>

  <!-- Right-mid cluster -->
  <polygon points="42,26 40,24 44,24" fill="#10B981"/>
  <polygon points="40,24 42,22 44,24" fill="#059669"/>
  <polygon points="42,22 40,20 44,22" fill="#10B981"/>

  <!-- Right-high cluster -->
  <polygon points="40,20 38,18 42,18" fill="#10B981"/>
  <polygon points="38,18 40,16 42,18" fill="#059669"/>

  <!-- Center top cluster -->
  <polygon points="32,22 30,20 34,20" fill="#10B981"/>
  <polygon points="30,20 32,18 34,20" fill="#059669"/>

  <!-- Glowing dot at fork -->
  <circle cx="32" cy="24" r="2" fill="#06B6D4" opacity="0.9" filter="url(#glow)"/>
</svg>
