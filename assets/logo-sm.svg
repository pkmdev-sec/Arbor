<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>

    <!-- Trunk gradient -->
    <linearGradient id="trunk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#1e293b" stroke-width="1"/>

  <!-- Main trunk (orchestrator) -->
  <path d="M 32,48 L 32,20" stroke="url(#trunk)" stroke-width="6" stroke-linecap="round"/>

  <!-- Fork point -->
  <circle cx="32" cy="25" r="2" fill="#F59E0B"/>

  <!-- Branches (simplified - 5 agents) -->
  <!-- Left branches -->
  <path d="M 32,25 Q 24,22 20,16" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 32,26 Q 26,25 22,21" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>

  <!-- Center branches -->
  <path d="M 32,27 Q 28,26 26,23" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 32,27 Q 36,26 38,23" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>

  <!-- Right branches -->
  <path d="M 32,26 Q 38,25 42,21" stroke="#06B6D4" stroke-width="2" stroke-linecap="round"/>
  <path d="M 32,25 Q 40,22 44,16" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Agent nodes at tips -->
  <circle cx="20" cy="16" r="1.5" fill="#06B6D4"/>
  <circle cx="22" cy="21" r="1.5" fill="#06B6D4"/>
  <circle cx="26" cy="23" r="1.5" fill="#06B6D4"/>
  <circle cx="38" cy="23" r="1.5" fill="#06B6D4"/>
  <circle cx="42" cy="21" r="1.5" fill="#06B6D4"/>
  <circle cx="44" cy="16" r="1.5" fill="#06B6D4"/>

  <!-- Convergence point -->
  <circle cx="32" cy="20" r="1.5" fill="#10B981" opacity="0.7"/>

  <!-- Root hint -->
  <path d="M 32,48 L 32,54" stroke="#1e293b" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
