<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="32" y1="6" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c2133"/>
      <stop offset="100%" stop-color="#0c0f18"/>
    </linearGradient>

    <!-- Trunk gradient -->
    <linearGradient id="trunk" x1="32" y1="49" x2="32" y2="33" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Branch gradient -->
    <linearGradient id="branch" x1="32" y1="33" x2="32" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset in="blur" dx="0" dy="1" result="offset"/>
      <feFlood flood-color="#000" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Node glow -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background with shadow -->
  <rect x="6" y="6" width="52" height="52" rx="12" ry="12"
        fill="url(#bg)" filter="url(#shadow)"/>

  <!-- Glass highlight -->
  <rect x="6" y="6" width="52" height="52" rx="12" ry="12"
        fill="white" opacity="0.04"/>

  <!-- Edge border -->
  <rect x="6.5" y="6.5" width="51" height="51" rx="11.5" ry="11.5"
        fill="none" stroke="white" stroke-opacity="0.06" stroke-width="0.5"/>

  <!-- Root base -->
  <rect x="28" y="48" width="8" height="2" rx="1" fill="#78350F"/>

  <!-- Trunk -->
  <line x1="32" y1="47.5" x2="32" y2="33"
        stroke="url(#trunk)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fork node -->
  <circle cx="32" cy="33" r="1.5" fill="#F59E0B"/>

  <!-- Left branch -->
  <line x1="32" y1="33" x2="20" y2="19"
        stroke="url(#branch)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center branch -->
  <line x1="32" y1="32" x2="32" y2="17"
        stroke="url(#branch)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right branch -->
  <line x1="32" y1="33" x2="44" y2="19"
        stroke="url(#branch)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Leaf nodes -->
  <circle cx="20" cy="19" r="3" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="32" cy="16" r="3.5" fill="#22D3EE" filter="url(#glow)"/>
  <circle cx="44" cy="19" r="3" fill="#06B6D4" filter="url(#glow)"/>
</svg>
