<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#141420;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0e18;stop-opacity:1"/>
    </radialGradient>

    <!-- Trunk gradient -->
    <linearGradient id="trunkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#92400E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1"/>
    </linearGradient>

    <!-- Glow filter for nodes -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="#1a1a2e" stroke-width="0.5"/>

  <!-- Roots -->
  <line x1="32" y1="50" x2="28" y2="56" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="50" x2="36" y2="56" stroke="#1e293b" stroke-width="1" opacity="0.3"/>

  <!-- Trunk (tapered) -->
  <path d="M 30.5 50 L 31.25 16 L 32.75 16 L 33.5 50 Z" fill="url(#trunkGrad)"/>

  <!-- Level 3 branches (y≈34, ±35°, length ~12px) -->
  <line x1="32" y1="34" x2="22.1" y2="27.1" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="41.9" y2="27.1" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Level 2 branches (y≈26, ±40°, length ~16px) -->
  <line x1="32" y1="26" x2="19.7" y2="15.7" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="26" x2="44.3" y2="15.7" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Level 1 branches (y≈18, ±22°, length ~14px) -->
  <line x1="32" y1="18" x2="26.7" y2="12.7" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="37.3" y2="12.7" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Canopy mesh lines connecting endpoints -->
  <line x1="22.1" y1="27.1" x2="26.7" y2="12.7" stroke="#10B981" stroke-width="0.7" opacity="0.4"/>
  <line x1="41.9" y1="27.1" x2="37.3" y2="12.7" stroke="#10B981" stroke-width="0.7" opacity="0.4"/>
  <line x1="26.7" y1="12.7" x2="37.3" y2="12.7" stroke="#10B981" stroke-width="0.7" opacity="0.4"/>
  <line x1="19.7" y1="15.7" x2="26.7" y2="12.7" stroke="#10B981" stroke-width="0.7" opacity="0.4"/>
  <line x1="44.3" y1="15.7" x2="37.3" y2="12.7" stroke="#10B981" stroke-width="0.7" opacity="0.4"/>

  <!-- Branch endpoint nodes with glow -->
  <circle cx="22.1" cy="27.1" r="1.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="41.9" cy="27.1" r="1.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="19.7" cy="15.7" r="1.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="44.3" cy="15.7" r="1.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="26.7" cy="12.7" r="1.5" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="37.3" cy="12.7" r="1.5" fill="#06B6D4" filter="url(#glow)"/>

  <!-- Fork node at main branch point -->
  <circle cx="32" cy="26" r="2" fill="#06B6D4" filter="url(#glow)"/>
</svg>
