<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 780">
  <!-- Background -->
  <rect width="700" height="780" fill="#0d0d14" rx="12"/>

  <!-- Markers for arrows -->
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#4a4a6a"/>
    </marker>
  </defs>

  <!-- 1. User Prompt -->
  <rect x="170" y="30" width="280" height="42" fill="#252535" rx="8" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="310" y="56" fill="#e2e8f0" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="500">User Prompt</text>

  <!-- Arrow 1 -->
  <line x1="310" y1="72" x2="310" y2="105" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- 2. Claude Code -->
  <rect x="170" y="105" width="280" height="50" fill="#252535" rx="8" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="310" y="125" fill="#F59E0B" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="600">Claude Code</text>
  <text x="310" y="142" fill="#6b7280" font-family="system-ui" font-size="10" text-anchor="middle">Opus 4.6 · 1M context</text>
  <text x="470" y="130" fill="#6b7280" font-family="system-ui" font-size="12">Main session with hooks active</text>

  <!-- Arrow 2 -->
  <line x1="310" y1="155" x2="310" y2="200" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="330" y="180" fill="#6b7280" font-family="system-ui" font-size="11">hooks intercept</text>

  <!-- 3. auto_orchestrator -->
  <rect x="170" y="200" width="280" height="50" fill="#252535" rx="8" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="310" y="220" fill="#8B5CF6" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="600">auto_orchestrator</text>
  <text x="310" y="237" fill="#6b7280" font-family="system-ui" font-size="10" text-anchor="middle">PreToolUse</text>
  <text x="470" y="225" fill="#6b7280" font-family="system-ui" font-size="12">DIRECT / DELEGATE / ORCHESTRATE</text>

  <!-- Arrow 3 -->
  <line x1="310" y1="250" x2="310" y2="305" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="340" y="280" fill="#6b7280" font-family="system-ui" font-size="11">if ORCHESTRATE</text>

  <!-- 4. swarm.mjs -->
  <rect x="170" y="305" width="280" height="140" fill="#252535" rx="8" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="310" y="325" fill="#F59E0B" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="600">swarm.mjs</text>
  <text x="470" y="375" fill="#6b7280" font-family="system-ui" font-size="12">Orchestrator</text>

  <!-- swarm.mjs content -->
  <text x="185" y="350" fill="#06B6D4" font-family="system-ui" font-size="12">autoMode()</text>
  <text x="280" y="350" fill="#6b7280" font-family="system-ui" font-size="12">→ Picks execution mode</text>

  <text x="185" y="370" fill="#06B6D4" font-family="system-ui" font-size="12">decompose()</text>
  <text x="280" y="370" fill="#6b7280" font-family="system-ui" font-size="12">→ Splits into subtasks</text>

  <text x="185" y="390" fill="#06B6D4" font-family="system-ui" font-size="12">execute*()</text>
  <text x="280" y="390" fill="#6b7280" font-family="system-ui" font-size="12">→ Runs agents in parallel</text>

  <text x="185" y="410" fill="#06B6D4" font-family="system-ui" font-size="12">verify()</text>
  <text x="280" y="410" fill="#6b7280" font-family="system-ui" font-size="12">→ Cross-checks results</text>

  <text x="185" y="430" fill="#06B6D4" font-family="system-ui" font-size="12">buildContract()</text>
  <text x="280" y="430" fill="#6b7280" font-family="system-ui" font-size="12">→ Packages final output</text>

  <!-- Arrow 4 -->
  <line x1="310" y1="445" x2="310" y2="505" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="340" y="478" fill="#6b7280" font-family="system-ui" font-size="11">spawns N agents</text>

  <!-- 5. agent-entry.mjs -->
  <rect x="170" y="505" width="280" height="120" fill="#252535" rx="8" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="310" y="525" fill="#F59E0B" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="600">agent-entry.mjs</text>
  <text x="470" y="565" fill="#6b7280" font-family="system-ui" font-size="12">× N (one per subtask)</text>

  <!-- agent-entry.mjs bullets -->
  <text x="185" y="550" fill="#6b7280" font-family="system-ui" font-size="11">· isolated env</text>
  <text x="185" y="570" fill="#6b7280" font-family="system-ui" font-size="11">· fresh 1M ctx</text>
  <text x="185" y="590" fill="#6b7280" font-family="system-ui" font-size="11">· no hooks</text>
  <text x="185" y="610" fill="#6b7280" font-family="system-ui" font-size="11">· own worktree</text>

  <!-- Arrow 5 -->
  <line x1="310" y1="625" x2="310" y2="685" stroke="#4a4a6a" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="340" y="658" fill="#6b7280" font-family="system-ui" font-size="11">writes to worktree</text>

  <!-- 6. isolation.mjs -->
  <rect x="170" y="685" width="280" height="50" fill="#252535" rx="8" stroke="#2d2d44" stroke-width="0.5"/>
  <text x="310" y="715" fill="#06B6D4" font-family="system-ui" font-size="14" text-anchor="middle" font-weight="600">isolation.mjs</text>
  <text x="470" y="710" fill="#6b7280" font-family="system-ui" font-size="12">Snapshot → Validate → Apply / Rollback</text>
</svg>
