<svg viewBox="0 0 600 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="boxAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxViolet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="boxEmerald" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="shadow" x="-2%" y="-4%" width="104%" height="114%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#3b4563"/>
    </marker>
    <marker id="arrA" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#F59E0B"/>
    </marker>
    <marker id="arrC" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#06B6D4"/>
    </marker>
    <marker id="arrE" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0.6 L6,2.5 L0,4.4" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="740" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="300" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="2.5">DATA FLOW</text>

  <!-- ═══ STAGE 1: User Prompt ═══ -->
  <rect x="140" y="50" width="320" height="44" rx="10" fill="#151c30" stroke="#242e4c" stroke-width="0.5" filter="url(#shadow)"/>
  <text x="300" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="500">User Prompt</text>

  <!-- Arrow + annotation -->
  <line x1="300" y1="96" x2="300" y2="126" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrA)" opacity="0.6"/>
  <text x="320" y="114" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">hooks intercept</text>

  <!-- ═══ STAGE 2: Claude Code ═══ -->
  <rect x="140" y="132" width="320" height="54" rx="10" fill="#151c30" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.3" filter="url(#shadow)"/>
  <rect x="140" y="132" width="320" height="54" rx="10" fill="url(#boxAmber)"/>
  <text x="300" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle" font-weight="600">Claude Code</text>
  <text x="300" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Opus 4.6 · 1M context</text>
  <text x="474" y="159" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Main session</text>

  <!-- Arrow + annotation -->
  <line x1="300" y1="188" x2="300" y2="218" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrA)" opacity="0.6"/>
  <text x="320" y="206" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">PreToolUse</text>

  <!-- ═══ STAGE 3: auto_orchestrator ═══ -->
  <rect x="140" y="224" width="320" height="54" rx="10" fill="#151c30" stroke="#8B5CF6" stroke-width="0.5" stroke-opacity="0.3" filter="url(#shadow)"/>
  <rect x="140" y="224" width="320" height="54" rx="10" fill="url(#boxViolet)"/>
  <text x="300" y="247" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8B5CF6" text-anchor="middle" font-weight="600">auto_orchestrator</text>
  <text x="300" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">DIRECT · DELEGATE · ORCHESTRATE</text>

  <!-- Arrow + annotation -->
  <line x1="300" y1="280" x2="300" y2="314" stroke="#8B5CF6" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arr)" opacity="0.6"/>
  <text x="320" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">if ORCHESTRATE</text>

  <!-- ═══ STAGE 4: swarm.mjs (detailed) ═══ -->
  <rect x="100" y="320" width="400" height="142" rx="12" fill="#151c30" stroke="#F59E0B" stroke-width="0.5" stroke-opacity="0.3" filter="url(#shadow)"/>
  <rect x="100" y="320" width="400" height="142" rx="12" fill="url(#boxAmber)"/>
  <text x="300" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#F59E0B" text-anchor="middle" font-weight="600">swarm.mjs</text>
  <text x="508" y="344" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Orchestrator</text>

  <!-- Function list -->
  <text x="130" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06B6D4" font-weight="500">autoMode()</text>
  <text x="248" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Picks execution mode</text>

  <text x="130" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06B6D4" font-weight="500">decompose()</text>
  <text x="248" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Splits into subtasks</text>

  <text x="130" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06B6D4" font-weight="500">execute*()</text>
  <text x="248" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Runs agents in parallel</text>

  <text x="130" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06B6D4" font-weight="500">verify()</text>
  <text x="248" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Cross-checks results</text>

  <text x="130" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#06B6D4" font-weight="500">buildContract()</text>
  <text x="248" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Packages final output</text>

  <!-- Arrow + annotation -->
  <line x1="300" y1="464" x2="300" y2="502" stroke="#06B6D4" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrC)" opacity="0.6"/>
  <text x="320" y="486" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">spawns N agents</text>

  <!-- ═══ STAGE 5: Agent Workers (3 side-by-side) ═══ -->
  <!-- 3 boxes × 120w × 80h, gaps=20, total=400, centered: start x=100 -->
  <rect x="100" y="508" width="120" height="80" rx="10" fill="#151c30" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.25" filter="url(#shadow)"/>
  <rect x="100" y="508" width="120" height="80" rx="10" fill="url(#boxCyan)"/>
  <text x="160" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle" font-weight="600">Agent 1</text>
  <text x="160" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">isolated env</text>
  <text x="160" y="564" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">fresh 1M ctx</text>
  <text x="160" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">own worktree</text>

  <rect x="240" y="508" width="120" height="80" rx="10" fill="#151c30" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.25" filter="url(#shadow)"/>
  <rect x="240" y="508" width="120" height="80" rx="10" fill="url(#boxCyan)"/>
  <text x="300" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle" font-weight="600">Agent 2</text>
  <text x="300" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">isolated env</text>
  <text x="300" y="564" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">fresh 1M ctx</text>
  <text x="300" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">own worktree</text>

  <rect x="380" y="508" width="120" height="80" rx="10" fill="#151c30" stroke="#06B6D4" stroke-width="0.5" stroke-opacity="0.25" filter="url(#shadow)"/>
  <rect x="380" y="508" width="120" height="80" rx="10" fill="url(#boxCyan)"/>
  <text x="440" y="534" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#06B6D4" text-anchor="middle" font-weight="600">Agent N</text>
  <text x="440" y="550" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">isolated env</text>
  <text x="440" y="564" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">fresh 1M ctx</text>
  <text x="440" y="578" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle">own worktree</text>

  <text x="508" y="548" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">x N workers</text>
  <text x="508" y="564" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">no hooks</text>

  <!-- Arrow + annotation -->
  <line x1="300" y1="590" x2="300" y2="628" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" marker-end="url(#arrE)" opacity="0.6"/>
  <text x="320" y="612" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">writes to worktree</text>

  <!-- ═══ STAGE 6: isolation.mjs ═══ -->
  <rect x="100" y="634" width="400" height="54" rx="10" fill="#151c30" stroke="#10B981" stroke-width="0.5" stroke-opacity="0.3" filter="url(#shadow)"/>
  <rect x="100" y="634" width="400" height="54" rx="10" fill="url(#boxEmerald)"/>
  <text x="300" y="657" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#10B981" text-anchor="middle" font-weight="600">isolation.mjs</text>
  <text x="300" y="676" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Snapshot → Validate → Apply / Rollback</text>
  <text x="508" y="661" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">Worktree mgmt</text>

  <!-- Decorative flow line (left side, connecting all stages) -->
  <line x1="120" y1="94" x2="120" y2="132" stroke="#1c2640" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="120" y1="186" x2="120" y2="224" stroke="#1c2640" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="80" y1="462" x2="80" y2="508" stroke="#1c2640" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="80" y1="588" x2="80" y2="634" stroke="#1c2640" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Stage numbers (left side) -->
  <circle cx="80" cy="72" r="10" fill="none" stroke="#242e4c" stroke-width="0.75"/>
  <text x="80" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">1</text>

  <circle cx="80" cy="159" r="10" fill="none" stroke="#242e4c" stroke-width="0.75"/>
  <text x="80" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">2</text>

  <circle cx="80" cy="251" r="10" fill="none" stroke="#242e4c" stroke-width="0.75"/>
  <text x="80" y="255" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">3</text>

  <circle cx="80" cy="391" r="10" fill="none" stroke="#242e4c" stroke-width="0.75"/>
  <text x="80" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">4</text>

  <circle cx="80" cy="548" r="10" fill="none" stroke="#242e4c" stroke-width="0.75"/>
  <text x="80" y="552" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">5</text>

  <circle cx="80" cy="661" r="10" fill="none" stroke="#242e4c" stroke-width="0.75"/>
  <text x="80" y="665" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569" text-anchor="middle" font-weight="600">6</text>
</svg>