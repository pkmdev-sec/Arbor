<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340">
  <rect width="820" height="340" rx="8" fill="#1a1b26"/>
  <rect width="820" height="32" rx="8" fill="#24283b"/>
  <circle cx="20" cy="16" r="6" fill="#f7768e"/>
  <circle cx="40" cy="16" r="6" fill="#e0af68"/>
  <circle cx="60" cy="16" r="6" fill="#9ece6a"/>
  <text x="410" y="20" text-anchor="middle" fill="#565f89" font-family="monospace" font-size="12">claude --dangerously-skip-permissions</text>
  <text x="16" y="60" fill="#7aa2f7" font-family="monospace" font-size="13">❯</text>
  <text x="30" y="60" fill="#c0caf5" font-family="monospace" font-size="13">explore the codebase and its code connectivity</text>
  <text x="16" y="88" fill="#c0caf5" font-family="monospace" font-size="13">● I'll explore the codebase structure and map connectivity.</text>
  <text x="16" y="116" fill="#f7768e" font-family="monospace" font-size="13">● Explore(Explore codebase structure)</text>
  <text x="30" y="136" fill="#f7768e" font-family="monospace" font-size="12">  PreToolUse:Agent hook returned blocking error</text>
  <text x="30" y="154" fill="#e0af68" font-family="monospace" font-size="12">  [Orchestrator] Agent tool blocked — use remote-agent via Bash.</text>
  <text x="30" y="172" fill="#565f89" font-family="monospace" font-size="12">  RUN: swarm --mode parallel --agents 4 --depth thorough ...</text>
  <text x="16" y="200" fill="#f7768e" font-family="monospace" font-size="12">  PreToolUse:Glob hook returned blocking error</text>
  <text x="30" y="218" fill="#e0af68" font-family="monospace" font-size="12">  [Orchestrator] Glob blocked during delegation</text>
  <text x="16" y="250" fill="#c0caf5" font-family="monospace" font-size="13">● Let me delegate this to the swarm for thorough analysis.</text>
  <text x="16" y="280" fill="#9ece6a" font-family="monospace" font-size="13">● Bash(swarm --mode parallel --agents 4 --depth thorough</text>
  <text x="30" y="298" fill="#9ece6a" font-family="monospace" font-size="13">        --result-file /tmp/swarm-result.json ...)</text>
  <text x="30" y="318" fill="#565f89" font-family="monospace" font-size="12">  Running...</text>
</svg>
