<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Swarm Execution Modes</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100vh; overflow: hidden; background: #000000; }
  svg { display: block; width: 100%; height: 100vh; }


  .edge-animated {
    stroke-dasharray: 6 3;
    animation: dashFlow 1.2s linear infinite;
  }
  @keyframes dashFlow {
    to { stroke-dashoffset: -18; }
  }
</style>
</head>
<body>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-slate" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
    <marker id="arr-cyan" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06B6D4" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B5CF6" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
    </marker>
  </defs>

  <rect width="960" height="560" fill="#000000" />

  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    <tspan fill="#06B6D4">&#9670;</tspan> Swarm Execution Modes
  </text>

  <!-- ═══════════════ ROW 1: single ═══════════════ -->
  <g class="node" style="animation-delay: 0.1s">
    <text x="55" y="85" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">single</text>

    <rect x="130" y="65" width="100" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="180" y="89" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Task</text>

    <line x1="230" y1="84" x2="330" y2="84" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arr-cyan)" />

    <rect x="340" y="65" width="100" height="38" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="390" y="89" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Agent</text>

    <line x1="440" y1="84" x2="540" y2="84" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)" />

    <rect x="550" y="65" width="100" height="38" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="600" y="89" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12">Result</text>
  </g>

  <!-- ═══════════════ ROW 2: parallel ═══════════════ -->
  <g class="node" style="animation-delay: 0.2s">
    <text x="55" y="185" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">parallel</text>

    <rect x="130" y="165" width="100" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="180" y="189" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Task</text>

    <line x1="230" y1="184" x2="290" y2="184" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-purple)" />

    <rect x="300" y="165" width="110" height="38" rx="8" fill="#111111" stroke="#8B5CF6" stroke-width="1" />
    <text x="355" y="189" text-anchor="middle" fill="#8B5CF6" font-family="system-ui, -apple-system, sans-serif" font-size="12">Decompose</text>

    <!-- Fan-out beziers -->
    <path d="M 410 175 C 440 175, 460 147, 490 147" stroke="#06B6D4" stroke-width="1.2" fill="none" marker-end="url(#arr-cyan)" />
    <path d="M 410 184 C 450 184, 470 184, 490 184" stroke="#06B6D4" stroke-width="1.2" fill="none" marker-end="url(#arr-cyan)" />
    <path d="M 410 193 C 440 193, 460 221, 490 221" stroke="#06B6D4" stroke-width="1.2" fill="none" marker-end="url(#arr-cyan)" />

    <rect x="500" y="130" width="100" height="34" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="550" y="152" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Agent 1</text>

    <rect x="500" y="167" width="100" height="34" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="550" y="189" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Agent 2</text>

    <rect x="500" y="204" width="100" height="34" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="550" y="226" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Agent 3</text>

    <!-- Fan-in beziers -->
    <path d="M 600 147 C 630 147, 650 175, 680 175" stroke="#10B981" stroke-width="1.2" fill="none" marker-end="url(#arr-green)" />
    <path d="M 600 184 C 640 184, 660 184, 680 184" stroke="#10B981" stroke-width="1.2" fill="none" marker-end="url(#arr-green)" />
    <path d="M 600 221 C 630 221, 650 193, 680 193" stroke="#10B981" stroke-width="1.2" fill="none" marker-end="url(#arr-green)" />

    <rect x="690" y="165" width="90" height="38" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="735" y="189" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12">Merge</text>

    <line x1="780" y1="184" x2="830" y2="184" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)" />

    <rect x="840" y="165" width="90" height="38" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="885" y="189" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12">Result</text>
  </g>

  <!-- ═══════════════ ROW 3: pipeline ═══════════════ -->
  <g class="node" style="animation-delay: 0.3s">
    <text x="55" y="295" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">pipeline</text>

    <rect x="130" y="275" width="110" height="38" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="185" y="299" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Research</text>

    <line x1="240" y1="294" x2="280" y2="294" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)" />

    <rect x="290" y="275" width="110" height="38" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="345" y="299" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Implement</text>

    <line x1="400" y1="294" x2="440" y2="294" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)" />

    <rect x="450" y="275" width="90" height="38" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="495" y="299" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Test</text>

    <line x1="540" y1="294" x2="580" y2="294" stroke="#475569" stroke-width="1.5" marker-end="url(#arr-slate)" />

    <rect x="590" y="275" width="100" height="38" rx="8" fill="#111111" stroke="#F59E0B" stroke-width="1" />
    <text x="640" y="299" text-anchor="middle" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12">Review</text>

    <line x1="690" y1="294" x2="730" y2="294" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)" />

    <rect x="740" y="275" width="90" height="38" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="785" y="299" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12">Result</text>
  </g>

  <!-- ═══════════════ ROW 4: swarm ═══════════════ -->
  <g class="node" style="animation-delay: 0.4s">
    <text x="55" y="400" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">swarm</text>

    <rect x="130" y="380" width="100" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="180" y="404" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Task</text>

    <line x1="230" y1="399" x2="290" y2="399" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr-purple)" />

    <rect x="300" y="380" width="110" height="38" rx="8" fill="#111111" stroke="#8B5CF6" stroke-width="1" />
    <text x="355" y="404" text-anchor="middle" fill="#8B5CF6" font-family="system-ui, -apple-system, sans-serif" font-size="12">Decompose</text>

    <!-- Fan-out -->
    <path d="M 410 390 C 440 390, 460 362, 490 362" stroke="#06B6D4" stroke-width="1.2" fill="none" marker-end="url(#arr-cyan)" />
    <path d="M 410 399 C 450 399, 470 399, 490 399" stroke="#06B6D4" stroke-width="1.2" fill="none" marker-end="url(#arr-cyan)" />
    <path d="M 410 408 C 440 408, 460 436, 490 436" stroke="#06B6D4" stroke-width="1.2" fill="none" marker-end="url(#arr-cyan)" />

    <rect x="500" y="345" width="100" height="34" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="550" y="367" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Agent 1</text>

    <rect x="500" y="382" width="100" height="34" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="550" y="404" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Agent 2</text>

    <rect x="500" y="419" width="100" height="34" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1" />
    <text x="550" y="441" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">Agent 3</text>

    <!-- Fan-in to Verify -->
    <path d="M 600 362 C 630 362, 650 390, 680 390" stroke="#F59E0B" stroke-width="1.2" fill="none" marker-end="url(#arr-amber)" />
    <path d="M 600 399 C 640 399, 660 399, 680 399" stroke="#F59E0B" stroke-width="1.2" fill="none" marker-end="url(#arr-amber)" />
    <path d="M 600 436 C 630 436, 650 408, 680 408" stroke="#F59E0B" stroke-width="1.2" fill="none" marker-end="url(#arr-amber)" />

    <rect x="690" y="380" width="90" height="38" rx="8" fill="#111111" stroke="#F59E0B" stroke-width="1" />
    <text x="735" y="404" text-anchor="middle" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12">Verify</text>

    <line x1="780" y1="399" x2="830" y2="399" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)" />

    <rect x="840" y="380" width="90" height="38" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="885" y="404" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12">Result</text>
  </g>

  <!-- ═══════════════ ROW 5: review ═══════════════ -->
  <g class="node" style="animation-delay: 0.5s">
    <text x="55" y="505" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">review</text>

    <rect x="130" y="485" width="100" height="38" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <text x="180" y="509" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">Task</text>

    <line x1="230" y1="504" x2="330" y2="504" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-amber)" />

    <rect x="340" y="485" width="100" height="38" rx="8" fill="#111111" stroke="#F59E0B" stroke-width="1" />
    <text x="390" y="509" text-anchor="middle" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12">Opus</text>

    <line x1="440" y1="504" x2="540" y2="504" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#arr-amber)" />

    <rect x="550" y="485" width="100" height="38" rx="8" fill="#111111" stroke="#F59E0B" stroke-width="1" />
    <text x="600" y="509" text-anchor="middle" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="12">Verify</text>

    <line x1="650" y1="504" x2="740" y2="504" stroke="#10B981" stroke-width="1.5" marker-end="url(#arr-green)" />

    <rect x="750" y="485" width="90" height="38" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="795" y="509" text-anchor="middle" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="12">Result</text>
  </g>

  <!-- Divider lines between rows -->
  <line x1="30" y1="123" x2="930" y2="123" stroke="#1a1a1a" stroke-width="1" />
  <line x1="30" y1="233" x2="930" y2="233" stroke="#1a1a1a" stroke-width="1" />
  <line x1="30" y1="343" x2="930" y2="343" stroke="#1a1a1a" stroke-width="1" />
  <line x1="30" y1="458" x2="930" y2="458" stroke="#1a1a1a" stroke-width="1" />
</svg>
</body>
</html>
