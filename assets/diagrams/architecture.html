<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remote Agent Architecture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100vh; overflow: hidden; background: #000000; }
  svg { display: block; width: 100%; height: 100vh; }


  /* Animated dashes on edges */
  .edge-animated {
    stroke-dasharray: 8 4;
    animation: dashFlow 1.5s linear infinite;
  }
  @keyframes dashFlow {
    to { stroke-dashoffset: -24; }
  }

  .edge-dashed {
    stroke-dasharray: 6 3;
  }

  /* Glow effects */
  .glow-amber { filter: drop-shadow(0 0 6px rgba(245,158,11,0.3)); }
  .glow-cyan { filter: drop-shadow(0 0 6px rgba(6,182,212,0.3)); }
  .glow-green { filter: drop-shadow(0 0 4px rgba(16,185,129,0.25)); }
</style>
</head>
<body>
<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow-amber" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06B6D4" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981" />
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 7" refX="10" refY="3.5"
      markerWidth="10" markerHeight="7" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#000000" />

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
    <tspan fill="#F59E0B">◆</tspan> Remote Agent Architecture
  </text>

  <!-- ═══════════════ ROW 1: Main Claude Session ═══════════════ -->
  <g class="node glow-amber">
    <rect x="290" y="55" width="320" height="70" rx="8" fill="#111111" stroke="#F59E0B" stroke-width="1.5" />
    <text x="450" y="85" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Main Claude Session</text>
    <text x="450" y="107" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Opus 4.6 · 1M context</text>
  </g>

  <!-- Edge: Main → Hooks (amber, animated) -->
  <path d="M 450 125 C 450 145, 450 155, 450 175" stroke="#F59E0B" stroke-width="2" fill="none"
    class="edge-animated" marker-end="url(#arrow-amber)" />

  <!-- ═══════════════ ROW 2: Hook Enforcement Layer ═══════════════ -->
  <g class="node">
    <rect x="155" y="180" width="590" height="65" rx="8" fill="#1a1a1a" stroke="#333333" stroke-width="1" />
    <text x="450" y="208" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Hook Enforcement Layer</text>
    <text x="450" y="228" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">auto_orchestrator → block_agent_tool → fulfill_delegate</text>
  </g>

  <!-- Edge: Hooks → Swarm (cyan, animated dashes) -->
  <path d="M 450 245 C 450 270, 450 285, 450 305" stroke="#06B6D4" stroke-width="2" fill="none"
    class="edge-animated" marker-end="url(#arrow-cyan)" />
  <text x="470" y="280" fill="#06B6D4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">DELEGATE</text>

  <!-- ═══════════════ ROW 3: swarm.mjs ═══════════════ -->
  <g class="node glow-cyan">
    <rect x="310" y="310" width="280" height="70" rx="8" fill="#111111" stroke="#06B6D4" stroke-width="1.5" />
    <text x="450" y="340" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">swarm.mjs</text>
    <text x="450" y="362" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">5 modes · worktree isolation</text>
  </g>

  <!-- Edges: Swarm → Agent 1, Agent 2, Agent 3 (cyan, solid with bezier fan-out) -->
  <path d="M 380 380 C 380 410, 200 420, 200 450" stroke="#06B6D4" stroke-width="1.5" fill="none"
    marker-end="url(#arrow-cyan)" />
  <path d="M 450 380 C 450 410, 450 430, 450 450" stroke="#06B6D4" stroke-width="1.5" fill="none"
    marker-end="url(#arrow-cyan)" />
  <path d="M 520 380 C 520 410, 700 420, 700 450" stroke="#06B6D4" stroke-width="1.5" fill="none"
    marker-end="url(#arrow-cyan)" />

  <!-- ═══════════════ ROW 4: Agents ═══════════════ -->
  <g class="node glow-cyan">
    <rect x="110" y="455" width="180" height="70" rx="8" fill="#0d2833" stroke="#06B6D4" stroke-width="1" />
    <text x="200" y="485" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Agent 1</text>
    <text x="200" y="505" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fresh 200K · No hooks</text>
  </g>

  <g class="node glow-cyan">
    <rect x="360" y="455" width="180" height="70" rx="8" fill="#0d2833" stroke="#06B6D4" stroke-width="1" />
    <text x="450" y="485" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Agent 2</text>
    <text x="450" y="505" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fresh 200K · No hooks</text>
  </g>

  <g class="node glow-cyan">
    <rect x="610" y="455" width="180" height="70" rx="8" fill="#0d2833" stroke="#06B6D4" stroke-width="1" />
    <text x="700" y="485" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Agent 3</text>
    <text x="700" y="505" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Fresh 200K · No hooks</text>
  </g>

  <!-- Edges: Agents → Worktrees (green, dashed) -->
  <path d="M 200 525 C 200 545, 200 555, 200 575" stroke="#10B981" stroke-width="1.5" fill="none"
    class="edge-dashed" marker-end="url(#arrow-green)" />
  <path d="M 450 525 C 450 545, 450 555, 450 575" stroke="#10B981" stroke-width="1.5" fill="none"
    class="edge-dashed" marker-end="url(#arrow-green)" />
  <path d="M 700 525 C 700 545, 700 555, 700 575" stroke="#10B981" stroke-width="1.5" fill="none"
    class="edge-dashed" marker-end="url(#arrow-green)" />

  <!-- ═══════════════ ROW 5: Worktrees ═══════════════ -->
  <g class="node glow-green">
    <rect x="130" y="580" width="140" height="55" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="200" y="605" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Worktree</text>
    <text x="200" y="622" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">isolated</text>
  </g>

  <g class="node glow-green">
    <rect x="380" y="580" width="140" height="55" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="450" y="605" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Worktree</text>
    <text x="450" y="622" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">isolated</text>
  </g>

  <g class="node glow-green">
    <rect x="630" y="580" width="140" height="55" rx="8" fill="#111111" stroke="#10B981" stroke-width="1" />
    <text x="700" y="605" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">Worktree</text>
    <text x="700" y="622" text-anchor="middle" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">isolated</text>
  </g>

  <!-- Legend -->
  <g transform="translate(30, 670)">
    <line x1="0" y1="5" x2="25" y2="5" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 4" />
    <text x="32" y="9" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">Hook flow</text>
    <line x1="110" y1="5" x2="135" y2="5" stroke="#06B6D4" stroke-width="2" />
    <text x="142" y="9" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">Agent spawn</text>
    <line x1="235" y1="5" x2="260" y2="5" stroke="#10B981" stroke-width="1.5" stroke-dasharray="6 3" />
    <text x="267" y="9" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10">Worktree isolation</text>
  </g>
</svg>
</body>
</html>
